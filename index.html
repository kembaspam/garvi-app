<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0b429">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<title>GARVI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f8fafc;
  --sidebar-bg:#0f2044;--sidebar-w:220px;--sidebar-w-sm:64px;
  --accent:#f0b429;--accent2:#d69f20;--accent-blue:#1a3a8f;
  --text:#0f2044;--text2:#4a6080;--muted:#8fa3c0;
  --border:#e2e8f0;--border2:#e8eef6;
  --shadow:0 2px 8px rgba(15,32,68,.08);--shadow-md:0 4px 20px rgba(15,32,68,.12);
  --danger:#dc2626;--success:#16a34a;--warn:#d97706;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow-x:hidden}

/* ── SIDEBAR ───────────────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:var(--sidebar-bg);display:flex;flex-direction:column;
  z-index:100;overflow:hidden;
}
.sidebar-logo{
  padding:22px 18px 18px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
}
.sidebar-logo-icon{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-logo-name{font-size:19px;font-weight:800;color:#fff;letter-spacing:.5px;line-height:1}
.sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.38);margin-top:3px;white-space:nowrap}
.sidebar-nav{flex:1;padding:10px 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.tab-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:11px 18px;
  background:none;border:none;border-left:3px solid transparent;
  color:rgba(255,255,255,.5);font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;text-align:left;
  min-height:44px;position:relative;
}
.tab-btn:hover{background:rgba(240,180,41,.1);color:var(--accent)}
.tab-btn.active{background:rgba(240,180,41,.16);border-left-color:var(--accent);color:var(--accent);font-weight:700}
.tab-icon{flex-shrink:0;width:22px;height:20px;display:flex;align-items:center;justify-content:center}
.tab-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.badge{
  background:#dc2626;color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;flex-shrink:0;
}
.sidebar-footer{
  padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;flex-shrink:0;overflow:hidden;
}
.sidebar-avatar{
  width:32px;height:32px;background:var(--accent);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--sidebar-bg);flex-shrink:0;
}
#sidebar-username{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sidebar-logout{
  background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;
  font-size:18px;padding:4px;line-height:1;transition:color .15s;flex-shrink:0;
}
.sidebar-logout:hover{color:#fca5a5}

/* ── LAYOUT ────────────────────────────────────────── */
#app{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .2s}
.section{display:none;padding:28px 32px;width:100%;box-sizing:border-box}
.section.active{display:block}
.section-header{position:sticky;top:0;z-index:50;background:var(--bg);padding:16px 0 10px;margin-bottom:16px}
.section-title{font-size:22px;font-weight:800;color:var(--text)}

/* Tablet: solo iconos */
@media(max-width:1023px) and (min-width:768px){
  #nav{width:var(--sidebar-w-sm)}
  #app{margin-left:var(--sidebar-w-sm)}
  .sidebar-logo-sub,.sidebar-logo-name,.tab-label,#sidebar-username,.sidebar-logout{display:none}
  .sidebar-logo{padding:14px;justify-content:center}
  .tab-btn{padding:13px;justify-content:center;border-left:none;border-bottom:3px solid transparent}
  .tab-btn.active{border-bottom-color:var(--accent);border-left-color:transparent}
  .sidebar-footer{padding:10px;justify-content:center}
  .sidebar-avatar{width:36px;height:36px}
}

/* Móvil: bottom nav */
@media(max-width:767px){
  #nav{
    width:100%;height:60px;
    top:auto;bottom:0;left:0;right:0;
    flex-direction:row;
    background:var(--surface);
    border-top:1px solid var(--border);
    box-shadow:0 -2px 12px rgba(15,32,68,.08);
  }
  .sidebar-logo,.sidebar-footer{display:none}
  .sidebar-nav{display:flex;flex-direction:row;width:100%;height:100%;padding:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sidebar-nav::-webkit-scrollbar{display:none}
  .tab-btn{
    flex:0 0 auto;width:68px;flex-direction:column;gap:3px;
    padding:5px 2px;justify-content:center;align-items:center;
    border-left:none;border-top:2px solid transparent;
    color:var(--muted);font-size:10px;min-height:unset;
  }
  .tab-btn.active{color:var(--accent);border-top-color:var(--accent);background:rgba(240,180,41,.05)}
  .tab-btn:hover{background:rgba(240,180,41,.05);color:var(--accent)}
  .tab-icon{width:auto;height:24px}
  .badge{position:absolute;top:4px;right:calc(50% - 18px);margin:0}
  #app{margin-left:0;padding-bottom:64px}
  .section{padding:16px}
  .section-header{top:0}
  .search-row{flex-wrap:wrap}
  .search-row .search-input{flex:1 1 100%}
  .lineas-table-wrap{overflow-x:auto}
  .lineas-table{min-width:520px}
  .modal{padding:16px}
  .doc-preview{padding:16px}
  .doc-head{flex-wrap:wrap;gap:10px}
}

/* ── LOGIN ─────────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#login-screen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#e8f0fe 0%,#f0f4f8 60%,#fef9ec 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:999;animation:fadeIn .4s ease;
}
.login-box{
  background:var(--surface);border-radius:20px;
  box-shadow:0 8px 40px rgba(15,32,68,.14);
  padding:40px 36px;width:min(400px,94vw);
  animation:scaleIn .4s ease;
}
.login-logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.login-logo-icon{
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 4px 14px rgba(240,180,41,.4));
}
.login-logo-name{font-size:28px;font-weight:800;color:var(--text);letter-spacing:.5px}
.login-logo-sub{font-size:12px;color:var(--muted);margin-top:2px}
.login-err{color:#dc2626;font-size:13px;margin-top:6px;min-height:18px;font-weight:500}

/* ── FORMS ─────────────────────────────────────────── */
input,select,textarea{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);font-family:inherit;
  font-size:14px;padding:10px 14px;width:100%;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(240,180,41,.15);
}
select option{background:var(--surface)}
label{
  display:block;font-size:11px;color:#6a84aa;
  margin-bottom:5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;
}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.form-row.cols2{grid-template-columns:1fr 1fr}
.form-row.cols3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){.form-row.cols2,.form-row.cols3{grid-template-columns:1fr}}

/* ── BUTTONS ───────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 18px;border-radius:10px;border:none;
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
  transition:all .15s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--sidebar-bg)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--surface);color:var(--accent-blue);border:2px solid var(--accent-blue)}
.btn-secondary:hover{background:var(--accent-blue);color:#fff}
.btn-danger{background:var(--surface);color:#dc2626;border:1.5px solid #fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;font-size:15px}
.btn-full{width:100%}

/* ── CARDS ─────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:16px;margin-bottom:10px;
  box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}

/* ── CONTENEDOR ROWS ───────────────────────────────── */
/* ── LISTA CONTENEDORES ─────────────────────────────── */
#cont-list{
  background:#fff;border-radius:14px;
  border:1px solid var(--border2);overflow:hidden;
  box-shadow:var(--shadow);
}
.cont-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:#fff;border-bottom:1px solid #f1f5f9;
  cursor:pointer;transition:background .12s;
}
.cont-row:last-child{border-bottom:none}
.cont-row:hover{background:#f8fafc}
.cont-num{
  font-family:'DM Mono',monospace;font-size:12px;font-weight:700;
  width:44px;height:44px;flex-shrink:0;
  border-radius:10px;text-align:center;
  display:flex;align-items:center;justify-content:center;
}
.s-normal{background:#1e3a8a;color:#fff}
.s-buenos{background:#14532d;color:#fff}
.s-aptos{background:#365314;color:#fff}
.s-reparados{background:#581c87;color:#fff}
.s-rotos{background:#7f1d1d;color:#fff}
.s-rotos_granja{background:#78350f;color:#fff}
.cont-info{flex:1;min-width:0}
.cont-cliente{font-weight:700;font-size:15px;color:#0f2044;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-detail{font-size:12px;color:#6a84aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.days-badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.days-ok{background:#dcfce7;color:#166534}
.days-warn{background:#fef3c7;color:#92400e}
.days-danger{background:#fee2e2;color:#991b1b}

/* ── DASHBOARD ─────────────────────────────────────── */
.dash-wrap{
  background:linear-gradient(135deg,var(--accent-blue) 0%,#0f2044 100%);
  border-radius:18px;padding:20px 22px;margin-bottom:18px;
  box-shadow:0 4px 24px rgba(26,58,143,.2);
}
.dash-greeting{font-size:22px;font-weight:800;color:#fff}
.dash-date{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:18px;text-transform:capitalize}
.dash-metrics{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dash-metrics::-webkit-scrollbar{display:none}
.dash-metric{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:12px;padding:12px 16px;flex-shrink:0;min-width:100px;
  cursor:pointer;transition:all .15s;backdrop-filter:blur(4px);
}
.dash-metric:hover{background:rgba(255,255,255,.18)}
.dash-metric-val{font-size:28px;font-weight:900;color:var(--accent);font-family:'DM Mono',monospace;line-height:1}
.dash-metric-label{font-size:11px;color:rgba(255,255,255,.55);font-weight:500;margin-top:4px}

/* ── STATE FILTER CHIPS ────────────────────────────── */
.state-cards{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}
.state-cards::-webkit-scrollbar{display:none}
.state-card{
  flex-shrink:0;padding:5px 12px;border-radius:20px;cursor:pointer;
  font-size:12px;font-weight:600;transition:all .15s;
  border:2px solid transparent;opacity:.7;
}
.state-card:hover{opacity:1;transform:translateY(-1px)}
.state-card.active{opacity:1;border-color:rgba(0,0,0,.25);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.state-card.inactive{opacity:.6}

/* ── VISTA TABS (Todos/Próximos/Retirar) ───────────── */
.view-tabs{display:flex;gap:6px;margin-bottom:12px}
.view-tab{
  padding:7px 16px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text2);
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
}
.view-tab:hover{border-color:var(--accent-blue);color:var(--accent-blue)}
.view-tab.active-all{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}
.view-tab.active-prox{background:#d97706;color:#fff;border-color:#d97706}
.view-tab.active-ret{background:#dc2626;color:#fff;border-color:#dc2626}

/* ── SEARCH ────────────────────────────────────────── */
.search-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search-input{
  flex:1;padding:10px 14px;font-size:14px;
  border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface);box-shadow:var(--shadow);
}

/* ── MODAL ─────────────────────────────────────────── */
#modal-overlay{
  position:fixed;inset:0;background:rgba(15,32,68,.45);
  backdrop-filter:blur(3px);z-index:5000;display:none;
  align-items:flex-end;justify-content:center;
}
@media(min-width:768px){#modal-overlay{align-items:center}}
#modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border-radius:20px 20px 0 0;
  width:100%;max-width:620px;max-height:92vh;overflow-y:auto;
  padding:22px;animation:slideUp .25s ease;
  box-shadow:0 -4px 40px rgba(15,32,68,.15);
}
@media(min-width:768px){.modal{border-radius:20px;max-height:88vh;animation:scaleIn .2s ease}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:17px;font-weight:800;color:var(--text)}

/* ── FACTURA TOGGLE ────────────────────────────────── */
.fact-toggle{
  display:flex;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:3px;margin-bottom:16px;gap:3px;
}
.fact-toggle-btn{
  flex:1;padding:9px;border:none;border-radius:8px;
  background:none;color:var(--muted);font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;
}
.fact-toggle-btn.active{background:var(--accent);color:var(--sidebar-bg);box-shadow:0 2px 8px rgba(240,180,41,.3)}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.qbtn{
  display:flex;flex-direction:column;align-items:flex-start;
  padding:9px 13px;border-radius:10px;
  border:1.5px solid rgba(26,58,143,.2);background:var(--surface2);
  color:var(--text);font-family:inherit;cursor:pointer;transition:all .15s;
  min-width:130px;text-align:left;box-shadow:var(--shadow);
}
.qbtn:hover{background:var(--accent);border-color:var(--accent);color:var(--sidebar-bg);box-shadow:0 3px 12px rgba(240,180,41,.3);transform:translateY(-1px)}
.qbtn:hover .qbtn-price{color:var(--sidebar-bg)}
.qbtn-name{font-size:12px;font-weight:700;line-height:1.3;color:inherit}
.qbtn-price{font-size:11px;color:var(--accent-blue);margin-top:4px;font-family:'DM Mono',monospace}
.qbtn-tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.qbtn-tab{
  padding:5px 14px;border-radius:20px;
  border:1.5px solid var(--border);background:var(--surface2);
  color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.qbtn-tab.active{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}
.lineas-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:13px}
.lineas-table th{
  text-align:left;padding:8px 10px;background:var(--accent-blue);
  color:#fff;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;
}
.lineas-table th:first-child{border-radius:8px 0 0 8px}
.lineas-table th:last-child{border-radius:0 8px 8px 0}
.lineas-table tr:nth-child(even) td{background:var(--surface2)}
.lineas-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.lineas-table input{
  padding:5px 8px;font-size:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
}
.totales-box{
  background:linear-gradient(135deg,#eff6ff,#f0f9ff);
  border:1.5px solid #bfdbfe;border-radius:12px;
  padding:16px;margin-top:12px;
}
.total-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--text2)}
.total-row.grand{
  color:var(--accent-blue);font-weight:800;font-size:19px;
  border-top:2px solid #bfdbfe;margin-top:10px;padding-top:12px;
  font-family:'DM Mono',monospace;
}

/* ── ALBARANES ─────────────────────────────────────── */
.albaran-ticket{
  background:var(--surface);border:1px solid var(--border2);
  border-left:4px solid var(--accent);border-radius:12px;
  padding:14px;margin-bottom:8px;box-shadow:var(--shadow);
}
.albaran-ticket-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.albaran-ticket-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent-blue);font-weight:700}
.albaran-ticket-date{font-size:11px;color:var(--muted)}
.albaran-ticket-title{font-weight:700;font-size:14px;color:var(--text);margin-bottom:3px}
.albaran-ticket-detail{font-size:12px;color:var(--muted)}
.albaran-ticket-actions{display:flex;gap:6px;margin-top:10px}

/* ── FACTURAS LIST ─────────────────────────────────── */
.factura-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:var(--surface);
  border:1px solid var(--border2);border-radius:12px;
  margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);
  transition:all .15s;
}
.factura-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.fact-badge{font-family:'DM Mono',monospace;font-size:11px;padding:4px 9px;border-radius:6px;font-weight:700;flex-shrink:0}
.fact-badge-p{background:#dbeafe;color:#1e40af}
.fact-badge-f{background:#dcfce7;color:#166534}
.fact-info{flex:1;min-width:0}
.fact-cliente{font-weight:700;font-size:14px;color:var(--text)}
.fact-meta{font-size:12px;color:var(--muted);margin-top:2px}
.fact-total{font-family:'DM Mono',monospace;font-size:15px;color:var(--accent-blue);font-weight:800}

/* ── CLIENTES ──────────────────────────────────────── */
.cliente-item{
  padding:14px 16px;background:var(--surface);
  border:1px solid var(--border2);border-radius:12px;
  margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);
  transition:all .15s;
}
.cliente-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-left:3px solid var(--accent)}
.cliente-nombre{font-weight:700;font-size:14px;color:var(--text);margin-bottom:5px}
.cliente-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}

/* ── TAREAS ────────────────────────────────────────── */
.tarea-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;background:var(--surface);
  border:1px solid var(--border2);border-radius:12px;
  margin-bottom:8px;box-shadow:var(--shadow);
}
.tarea-check{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;margin-top:1px;transition:all .15s;
}
.tarea-check.done{background:var(--success);border-color:var(--success);color:#fff}
.tarea-body{flex:1}
.tarea-titulo{font-size:14px;font-weight:500;color:var(--text);transition:opacity .15s}
.tarea-titulo.done{opacity:.45;text-decoration:line-through}
.tarea-meta{font-size:11px;color:var(--muted);margin-top:2px}

/* ── FINANZAS ──────────────────────────────────────── */
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.fin-sum-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow);
}
.fin-sum-val{font-size:22px;font-weight:800;font-family:'DM Mono',monospace}
.fin-sum-label{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── MISC ──────────────────────────────────────────── */
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .icon{font-size:44px;margin-bottom:10px}
.photo-thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--border)}
.photos-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--surface2);border:1px solid var(--border)}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--sidebar-bg);color:#fff;border-radius:10px;
  padding:10px 20px;font-size:13px;font-weight:600;z-index:6000;
  opacity:0;transition:opacity .2s;pointer-events:none;
  box-shadow:0 4px 20px rgba(15,32,68,.3);
}
.toast.show{opacity:1}
@media(min-width:768px){.toast{bottom:24px}}
/* ── PRESUPUESTOS ─────────────────────────────────── */
.pres-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:720px){.pres-layout{grid-template-columns:1fr}}
/* ── INICIO / CALENDARIO ─────────────────────────────────────── */
.inicio-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.inicio-layout{grid-template-columns:1fr}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head-title{font-size:15px;font-weight:800;color:var(--text);text-transform:capitalize}
.cal-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center}
.cal-nav-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{position:relative;aspect-ratio:1;border-radius:10px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12.5px;color:var(--text);gap:2px;transition:all .12s}
.cal-day:hover{background:var(--surface2);transform:scale(1.04)}
.cal-day.other{color:var(--muted);opacity:.32}
.cal-day.today{border-color:var(--accent);font-weight:800;box-shadow:0 0 0 2px rgba(240,180,41,.15)}
.cal-day.selected{background:var(--sidebar-bg);color:#fff;font-weight:800;box-shadow:0 2px 8px rgba(15,32,68,.3)}
.cal-day.permiso-activo{background:rgba(124,58,237,.12)}
.cal-day.selected.permiso-activo{background:var(--sidebar-bg)}
.cal-dots{display:flex;gap:3px;position:absolute;bottom:4px}
.cal-dot{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.cal-legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--text2);background:var(--surface2);padding:4px 9px 4px 7px;border-radius:20px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.agenda-item{display:flex;gap:10px;align-items:flex-start;padding:11px 8px 11px 12px;border-bottom:1px solid var(--border2);border-left:4px solid transparent;border-radius:6px;margin-bottom:2px;background:var(--surface2);transition:background .15s}
.agenda-item:last-child{margin-bottom:0}
.agenda-item.done{background:#dcfce7}
.agenda-item.done .agenda-nota{opacity:.55;text-decoration:line-through}
.agenda-item .tarea-check{margin-top:2px}
.agenda-tipo-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.agenda-cantidad{font-size:11px;font-weight:800;color:#fff;background:var(--accent-blue);border-radius:20px;padding:1px 7px;margin-left:5px}
.agenda-section-title{font-size:11px;font-weight:800;color:var(--success);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px;padding-top:10px;border-top:1px dashed var(--border)}
.agenda-unidades{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.agenda-unidad{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--text2);cursor:pointer;flex-shrink:0;background:var(--surface)}
.agenda-unidad:hover{border-color:var(--accent);color:var(--accent)}
.agenda-unidad.done{background:var(--success);border-color:var(--success);color:#fff}
.sync-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.sync-status.sync-on{background:#dcfce7;color:#166534}
.sync-status.sync-conectando{background:#fef3c7;color:#92400e}
.sync-status.sync-error{background:#fee2e2;color:#991b1b}
.agenda-hora{font-size:11px;font-weight:700;color:var(--text2);margin-left:6px}
.agenda-nota{font-size:13.5px;color:var(--text);font-weight:600;margin-top:1px}
.agenda-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.agenda-copy-link{color:var(--accent-blue);cursor:pointer;text-decoration:underline;font-weight:700;margin-left:4px}
.cat-row{display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12px}
.cat-row:last-child{border-bottom:none}
.cat-name{flex:1;color:var(--text);font-weight:600}
.cat-iva{color:var(--muted);font-size:11px;flex-shrink:0;white-space:nowrap}
.cat-price-inp{width:65px!important;padding:4px 6px!important;font-size:12px!important;text-align:right}
.pres-list{list-style:none;margin:0;padding:0;font-size:13px}
.pres-list li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border)}
.pres-list li:last-child{border-bottom:none}
.pres-item-name{flex:1;color:var(--text);font-size:12px}
.pres-item-price{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent-blue);white-space:nowrap;flex-shrink:0}
.pres-preview-wrap{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:24px;box-shadow:var(--shadow)}

.doc-logo-box{background:#07235c;border-radius:8px;padding:8px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.doc-title-right{text-align:right}

.doc-meta-line{font-size:12px;margin-bottom:14px;color:#333}

.doc-sign-wrap img{width:200px;display:block;margin:0 auto 4px}
.doc-sign-name{font-size:11px;color:#333;text-align:center}
.cert-table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:11.5px}
.cert-table th{background:#0f2044;color:#fff;padding:7px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.cert-table td{padding:8px;border:1px solid #ddd;color:#222;vertical-align:top}

.cont-map-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}

let fbDb=null, fbReady=false, avisosUnsub=null, lastSyncStatus='off';
function setSyncStatus(estado){
  // estado: 'off' | 'conectando' | 'on' | 'error'
  lastSyncStatus=estado;
  const el=document.getElementById('sync-status'); if(!el) return;
  const cfgs={
    off:{txt:'',cls:''},
    conectando:{txt:'🔄 Conectando sincronización…',cls:'sync-conectando'},
    on:{txt:'☁️ Sincronizado en la nube',cls:'sync-on'},
    error:{txt:'⚠️ Sin conexión a la nube (usando datos locales)',cls:'sync-error'},
  };
  const c=cfgs[estado]||cfgs.off;
  el.textContent=c.txt; el.className='sync-status '+c.cls;
}
function initFirebase(){
  if(typeof firebase==='undefined'){ setSyncStatus('error'); return; }
  try{
    setSyncStatus('conectando');
    firebase.initializeApp(firebaseConfig);
    fbDb=firebase.firestore();
    fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    firebase.auth().signInAnonymously().then(()=>{
      fbReady=true;
      setSyncStatus('on');
      suscribirAvisosFirestore();
    }).catch(e=>{
      console.error('Firebase auth:',e);
      setSyncStatus('error');
    });
  }catch(e){
    console.error('Firebase init:',e);
    setSyncStatus('error');
  }
}
function suscribirAvisosFirestore(){
  if(!fbDb) return;
  if(avisosUnsub) avisosUnsub();
  avisosUnsub=fbDb.collection('avisos').onSnapshot(snap=>{
    const nuevos=[];
    snap.forEach(doc=>nuevos.push(doc.data()));
    nuevos.forEach(migrarAviso);
    avisos=nuevos;
    saveAvisos();
    if(document.getElementById('sec-inicio')&&currentTab==='inicio'){ renderCalendar(); renderAgenda(); }
    setSyncStatus('on');
  },err=>{
    console.error('Firestore avisos onSnapshot:',err);
    setSyncStatus('error');
  });
}
function syncAviso(a){
  if(!fbDb||!fbReady) return;
  fbDb.collection('avisos').doc(a.id).set(a).catch(e=>console.error('Error guardando aviso en la nube:',e));
}
function syncBorrarAviso(id){
  if(!fbDb||!fbReady) return;
  fbDb.collection('avisos').doc(id).delete().catch(e=>console.error('Error borrando aviso en la nube:',e));
}

const DATA_VERSION=6; // subir cuando RAW/INIT cambie y deba refrescarse en navegadores ya inicializados
function loadData(){
  const raw=localStorage.getItem(LSKEY);
  const storedVersion=parseInt(localStorage.getItem('garvi_data_version')||'1',10);
  if(raw&&storedVersion>=DATA_VERSION){
    containers=JSON.parse(raw);
  } else {
    const existing=raw?JSON.parse(raw):[];
    const existingByNum={}; existing.forEach(c=>existingByNum[c.num]=c);
    containers=INIT.map(c=>{
      const old=existingByNum[c.num];
      return old?{...c,estadoExcel:old.estadoExcel,notas:old.notas||'',fotos:old.fotos||[]}:{...c};
    });
    saveContainers();
    localStorage.setItem('garvi_data_version',String(DATA_VERSION));
  }
  albaranes=JSON.parse(localStorage.getItem('garvi_albaranes')||'[]');
  tareas=JSON.parse(localStorage.getItem('garvi_tareas')||'[]');
  finanzas=JSON.parse(localStorage.getItem('garvi_finanzas')||'[]');
  facturas=JSON.parse(localStorage.getItem('garvi_facturas')||'[]');
  cfg=JSON.parse(localStorage.getItem('garvi_cfg')||'{"apiKey":"","ultimaFact":0,"ultimaProf":0}');
  certificados=JSON.parse(localStorage.getItem('garvi_certificados')||'[]');
  avisos=JSON.parse(localStorage.getItem('garvi_avisos')||'[]');
  avisos.forEach(migrarAviso);
  syncClientes();
}
// Convierte el antiguo campo done/completadoEn (un solo tick) al nuevo array "completados" (una marca de tiempo por unidad hecha)
function migrarAviso(a){
  if(!Array.isArray(a.completados)){
    a.completados=(a.done)?[a.completadoEn||new Date().toISOString()]:[];
  }
  if(!a.cantidad) a.cantidad=1;
  return a;
}
function saveContainers(){localStorage.setItem(LSKEY,JSON.stringify(containers));}
function saveAlbaranes(){localStorage.setItem('garvi_albaranes',JSON.stringify(albaranes));}
function saveTareas(){localStorage.setItem('garvi_tareas',JSON.stringify(tareas));}
function saveFinanzas(){localStorage.setItem('garvi_finanzas',JSON.stringify(finanzas));}
function saveFacturas(){localStorage.setItem('garvi_facturas',JSON.stringify(facturas));}
function saveCfg(){localStorage.setItem('garvi_cfg',JSON.stringify(cfg));}
function saveCertificados(){localStorage.setItem('garvi_certificados',JSON.stringify(certificados));}
function saveAvisos(){localStorage.setItem('garvi_avisos',JSON.stringify(avisos));}

function getClienteExtra(nombre){const m=JSON.parse(localStorage.getItem('garvi_clientes_extra')||'{}');return m[nombre]||{};}
function saveClienteExtra(nombre,data){const m=JSON.parse(localStorage.getItem('garvi_clientes_extra')||'{}');m[nombre]={...(m[nombre]||{}),...data};localStorage.setItem('garvi_clientes_extra',JSON.stringify(m));}
function syncClientes(){
  const mapa={};
  containers.forEach(c=>{
    const nom=c.cliente;
    if(!nom||nom==='NAVE GARVI'||nom==='GRANJA TORRELLANO') return;
    const ex=getClienteExtra(nom);
    if(!mapa[nom]) mapa[nom]={id:'cl-'+nom.toLowerCase().replace(/\s+/g,'-'),nombre:nom,telefono:c.telefono||'',direccion:c.direccion||'',dirFacturacion:ex.dirFacturacion||'',cif:ex.cif||'',contenedores:[],fechaUltimoServicio:'',totalServicios:0,notas:''};
    const cl=mapa[nom];
    if(c.telefono&&!cl.telefono) cl.telefono=c.telefono;
    if(!cl.contenedores.includes(c.num)) cl.contenedores.push(c.num);
    if(!cl.fechaUltimoServicio||c.fecha>cl.fechaUltimoServicio) cl.fechaUltimoServicio=c.fecha;
    cl.totalServicios=cl.contenedores.length;
  });
  clientes=Object.values(mapa).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  localStorage.setItem('garvi_clientes_v1',JSON.stringify(clientes));
}

function getContainer(num){return containers.find(c=>c.num===num);}
function daysSince(fecha){
  if(!fecha) return 0;
  return Math.floor((Date.now()-new Date(fecha).getTime())/86400000);
}
function fmtFecha(f){
  if(!f) return '—';
  var p=f.split('-');
  return p[2]+'/'+p[1]+'/'+p[0].slice(2);
}
function daysBadge(dias,fecha){
  const cls=dias<11?'days-ok':dias<14?'days-warn':'days-danger';
  return `<span class="days-badge ${cls}">${fmtFecha(fecha)}</span>`;
}
function fmtDate(iso){if(!iso) return '';const d=new Date(iso);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'});}
// Fecha YYYY-MM-DD en hora LOCAL (toISOString() convierte a UTC y desplaza el día en husos horarios positivos como España)
function localISO(y,m,d){
  const dt=new Date(y,m,d);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function todayISO(){const n=new Date();return localISO(n.getFullYear(),n.getMonth(),n.getDate());}
function addDaysISO(days){const n=new Date();n.setDate(n.getDate()+days);return localISO(n.getFullYear(),n.getMonth(),n.getDate());}
function fmtMoney(n){return Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+'€';}
function fmtPresPrice(n){const v=Number(n||0);return v.toLocaleString('es-ES',{minimumFractionDigits:v%1===0?0:2,maximumFractionDigits:2})+'€';}
function fmtPresDate(iso){if(!iso)return '—';const[y,m,d]=iso.split('-');return`${d}-${m}-${y}`;}
function toastMsg(msg,ms=2200){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}
// Vuelve a enfocar un input tras un re-render completo de sección (evita perder el foco al escribir)
function reFocusInput(id,fn){
  const prev=document.getElementById(id);
  const pos=prev?prev.selectionStart:null;
  fn();
  const el=document.getElementById(id);
  if(el){el.focus();if(pos!==null){try{el.setSelectionRange(pos,pos);}catch(e){}}}
}

const USERS={ivan:{pass:'74392853c',label:'Iván'},halem:{pass:'74369288f',label:'Halem'}};
function setSidebarUser(label){
  const el=document.getElementById('sidebar-username');
  const av=document.getElementById('sidebar-avatar');
  if(el) el.textContent=label;
  if(av) av.textContent=label?label[0].toUpperCase():'?';
}
function handleLogin(){
  const u=(document.getElementById('li-user').value||'').toLowerCase().trim();
  const p=(document.getElementById('li-pass').value||'').trim();
  const remember=document.getElementById('li-remember').checked;
  const usr=USERS[u];
  if(!usr||usr.pass!==p){document.getElementById('li-err').textContent='Usuario o contraseña incorrectos';return;}
  const sessionData=JSON.stringify({user:u,label:usr.label});
  if(remember) localStorage.setItem('garvi_session',sessionData);
  else sessionStorage.setItem('garvi_session',sessionData);
  currentUser=usr.label;
  setSidebarUser(currentUser);
  document.getElementById('login-screen').style.animation='fadeIn .3s ease reverse';
  setTimeout(()=>{document.getElementById('login-screen').style.display='none';},300);
  loadData();
  renderTab('inicio');
  updateBadge();
}
function checkSession(){
  const s=JSON.parse(localStorage.getItem('garvi_session')||sessionStorage.getItem('garvi_session')||'null');
  if(s){currentUser=s.label;setSidebarUser(currentUser);loadData();renderTab('inicio');updateBadge();}
}
function logout(){localStorage.removeItem('garvi_session');sessionStorage.removeItem('garvi_session');location.reload();}

function updateBadge(){
  const today=todayISO();
  const cnt=containers.filter(c=>c.cliente!=='NAVE GARVI'&&c.cliente!=='GRANJA TORRELLANO'&&daysSince(c.fecha)>=14).length;
  const b=document.getElementById('badge-ret');
  if(cnt>0){b.textContent=cnt;b.style.display='flex';}
  else b.style.display='none';
}

function renderTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.toggle('active',b.dataset.param===tab);});
  document.querySelectorAll('.section').forEach(s=>{s.classList.remove('active');});
  document.getElementById('sec-'+tab).classList.add('active');

function esPermisoActivo(a,dateStr){
  if(a.tipo!=='permiso'&&a.tipo!=='renovacion') return false;
  const fin=a.fechaFin||a.fecha;
  return dateStr>=a.fecha&&dateStr<=fin;
}
// Avisos visibles ese día: en el último día de un permiso, se oculta el "Permiso" (queda solo la Retirada que lo representa)
function avisosDelDia(dateStr){
  return avisos.filter(a=>{
    if((a.tipo==='permiso'||a.tipo==='renovacion')&&a.fechaFin&&a.fechaFin===dateStr) return false;
    return a.fecha===dateStr||esPermisoActivo(a,dateStr);
  });
}
function renderCalendar(){
  const wrap=document.getElementById('cal-wrap'); if(!wrap) return;
  const hoy=todayISO();
  const first=new Date(calYear,calMonth,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrevMonth=new Date(calYear,calMonth,0).getDate();
  const cells=[];
  for(let i=startOffset-1;i>=0;i--) cells.push({d:daysInPrevMonth-i,other:true,m:calMonth-1});
  for(let d=1;d<=daysInMonth;d++) cells.push({d,other:false,m:calMonth});
  while(cells.length%7!==0) cells.push({d:cells.length-startOffset-daysInMonth+1,other:true,m:calMonth+1});
  const dow=['L','M','X','J','V','S','D'];
  const monthLabel=first.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let html=`<div class="cal-head">
    <button class="cal-nav-btn" data-action="cal-prev">‹</button>
    <div class="cal-head-title">${monthLabel}</div>
    <button class="cal-nav-btn" data-action="cal-next">›</button>
  </div>
  <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;
  cells.forEach(c=>{
    const iso=localISO(calYear,c.m,c.d);
    const dayAvisos=avisosDelDia(iso);
    const tipos=[...new Set(dayAvisos.map(a=>a.tipo))];
    const dots=tipos.slice(0,4).map(t=>`<span class="cal-dot" style="background:${(AVISO_CFG[t]||{}).color||'#999'}"></span>`).join('');
    const cls=['cal-day'];
    if(c.other) cls.push('other');
    if(iso===hoy) cls.push('today');
    if(iso===calSelDay) cls.push('selected');
    if(dayAvisos.some(a=>a.tipo==='permiso'||a.tipo==='renovacion')) cls.push('permiso-activo');
    html+=`<div class="${cls.join(' ')}" data-action="cal-sel-day" data-param="${iso}"><span>${c.d}</span><span class="cal-dots">${dots}</span></div>`;
  });
  html+=`</div>
  <div class="cal-legend">${Object.entries(AVISO_CFG).map(([k,v])=>`<span><i style="background:${v.color}"></i>${v.label}</span>`).join('')}</div>`;
  wrap.innerHTML=html;
}

function unidadesCompletadasDelDia(dateStr){
  const entries=[];
  avisosDelDia(dateStr).forEach(a=>{
    (a.completados||[]).forEach((ts,idx)=>entries.push({a,idx,ts,total:a.cantidad||1}));
  });
  entries.sort((x,y)=>(x.ts||'').localeCompare(y.ts||''));
  return entries;
}
function renderAgenda(){
  const list=document.getElementById('agenda-list'); if(!list) return;
  const title=document.getElementById('agenda-title');
  const todos=avisosDelDia(calSelDay);
  const pendientes=todos.filter(a=>(a.completados||[]).length<(a.cantidad||1)).sort((a,b)=>{
    if(a.hora&&b.hora) return a.hora.localeCompare(b.hora);
    if(a.hora&&!b.hora) return -1;
    if(!a.hora&&b.hora) return 1;
    return (a.creada||'').localeCompare(b.creada||'');
  });
  const completadas=unidadesCompletadasDelDia(calSelDay);
  const dt=new Date(calSelDay+'T00:00:00');
  title.textContent=dt.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  let html='';
  if(!pendientes.length&&!completadas.length){
    html='<div class="empty-state" style="padding:20px 0"><div class="icon">🗓</div>Sin avisos este día</div>';
  } else {
    html+=pendientes.map(renderAvisoCard).join('')||'<div class="empty-state" style="padding:10px 0">Sin avisos pendientes</div>';
    if(completadas.length){
      html+=`<div class="agenda-section-title">✅ Completados (${completadas.length})</div>`;
      html+=completadas.map(renderUnidadCompletada).join('');
    }
  }
  list.innerHTML=html;
}

function buildAvisoCopyText(a,cantidadCopiar){
  const cfg=AVISO_CFG[a.tipo]||{label:a.tipo};
  const n=cantidadCopiar||a.cantidad||1;
  let primera=n>1?`${cfg.label} +${n-1}`:cfg.label;
  if(a.hora) primera+=` - ${a.hora}h`;
  const parts=[primera];
  if(a.nota) parts.push(a.nota);
  if(a.direccion) parts.push(a.direccion+'\n'+mapsLinkFor(a.direccion));
  if(a.telefono) parts.push(a.telefono);
  if(a.pago) parts.push(a.pago);
  if(a.infoAdicional) parts.push(a.infoAdicional);
  return parts.join('\n\n');
}
function copyToClipboard(text,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toastMsg(msg||'Copiado ✓')).catch(()=>fallbackCopy(text,msg));
  } else fallbackCopy(text,msg);
}
function fallbackCopy(text,msg){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy');toastMsg(msg||'Copiado ✓');}catch(e){toastMsg('No se pudo copiar');}
  document.body.removeChild(ta);
}

function crearAviso(){
  const tipo=document.getElementById('av-tipo').value;
  const editando=editAvisoId?avisos.find(x=>x.id===editAvisoId):null;
  if(tipo==='renovacion'){
    const permId=(document.getElementById('av-permiso')||{}).value;

    if(!nuevaFin){toastMsg('Indica la nueva fecha final');return;}
    if(editando&&editando.tipo==='renovacion'){
      editando.permisoId=perm.id; editando.fechaFin=nuevaFin; editando.nota='Renovación de: '+(perm.nota||'Permiso');
      editando.direccion=perm.direccion||''; editando.telefono=perm.telefono||'';
      syncAviso(editando);
    } else {
      perm.fechaFin=nuevaFin;
      syncAviso(perm);
      const nuevaRenovacion={id:Date.now().toString(),tipo:'renovacion',fecha:todayISO(),fechaFin:nuevaFin,cantidad:1,completados:[],nota:'Renovación de: '+(perm.nota||'Permiso'),direccion:perm.direccion||'',telefono:perm.telefono||'',permisoId:perm.id,creada:new Date().toISOString()};
      avisos.push(nuevaRenovacion); syncAviso(nuevaRenovacion);
      const retiradaLigada=avisos.find(a=>a.tipo==='retirada'&&a.autoFrom===perm.id);
      if(retiradaLigada){ retiradaLigada.fecha=nuevaFin; syncAviso(retiradaLigada); }
      else{
        const nuevaRetirada={id:Date.now().toString()+'r',tipo:'retirada',fecha:nuevaFin,cantidad:1,completados:[],nota:'Retirada — fin de permiso: '+(perm.nota||''),direccion:perm.direccion||'',telefono:perm.telefono||'',pago:'',infoAdicional:'',autoFrom:perm.id,creada:new Date().toISOString()};
        avisos.push(nuevaRetirada); syncAviso(nuevaRetirada);
      }
    }
    saveAvisos();closeModal();renderCalendar();renderAgenda();toastMsg('Permiso renovado ✓');
    return;
  }
  const nota=(document.getElementById('av-nota')||{}).value||'';
  const direccion=(document.getElementById('av-direccion')||{}).value||'';
  const telefono=(document.getElementById('av-telefono')||{}).value||'';
  const pago=(document.getElementById('av-pago')||{}).value||'';
  const infoAdicional=(document.getElementById('av-info')||{}).value||'';
  const fecha=(document.getElementById('av-fecha')||{}).value||calSelDay;
  const fechaFin=(document.getElementById('av-fechafin')||{}).value||'';
  const hora=(document.getElementById('av-hora')||{}).value||'';
  const cantidad=Math.max(1,parseInt((document.getElementById('av-cantidad')||{}).value,10)||1);
  if(tipo==='permiso'&&!nota){toastMsg('Indica el cliente del permiso');return;}
  const datos={tipo,fecha,fechaFin:tipo==='permiso'?fechaFin:'',hora,cantidad,nota:nota.trim(),direccion:direccion.trim(),telefono:telefono.trim(),pago:pago.trim(),infoAdicional:infoAdicional.trim()};
  const targetId=editando?editando.id:Date.now().toString();
  if(editando){ Object.assign(editando,datos); syncAviso(editando); }
  else{
    const nuevoAv={id:targetId,...datos,completados:[],creada:new Date().toISOString()};
    avisos.push(nuevoAv); syncAviso(nuevoAv);
  }
  // Sincroniza (o crea/quita) la retirada automática ligada al permiso
  const retiradaLigada=avisos.find(x=>x.tipo==='retirada'&&x.autoFrom===targetId);
  if(tipo==='permiso'&&fechaFin){
    if(retiradaLigada){
      Object.assign(retiradaLigada,{fecha:fechaFin,nota:'Retirada — fin de permiso: '+nota.trim(),direccion:direccion.trim(),telefono:telefono.trim()});
      syncAviso(retiradaLigada);
    } else {
      const nuevaRetirada={id:targetId+'r',tipo:'retirada',fecha:fechaFin,cantidad:1,completados:[],nota:'Retirada — fin de permiso: '+nota.trim(),direccion:direccion.trim(),telefono:telefono.trim(),pago:'',infoAdicional:'',autoFrom:targetId,creada:new Date().toISOString()};
      avisos.push(nuevaRetirada); syncAviso(nuevaRetirada);
    }
  } else if(retiradaLigada){
    avisos=avisos.filter(x=>x.id!==retiradaLigada.id);
    syncBorrarAviso(retiradaLigada.id);
  }

}

// ─── MAPA DE CONTENEDORES (Leaflet + OSM / satélite Esri, sin API key) ──
function geoCacheGet(addr){
  const cache=JSON.parse(localStorage.getItem('garvi_geocode_cache_v4')||'{}');
  return cache[addr];
}
function geoCacheSet(addr,val){
  const cache=JSON.parse(localStorage.getItem('garvi_geocode_cache_v4')||'{}');
  cache[addr]=val;
  localStorage.setItem('garvi_geocode_cache_v4',JSON.stringify(cache));
}
const CIUDAD_OFICIAL={
  'San Vicente':'San Vicente del Raspeig',
  'San Juan':'San Juan de Alicante',
  'San Juan Pueblo':'San Juan de Alicante',
  'El Campello':'El Campello',
  'Muchamiel':'Muchamiel',
  'Busot':'Busot',
  'Torrellano':'Elche',
  'Moralet':'Alicante',
  'Gran Alacant':'Santa Pola',
  'Elche':'Elche',
  'Alicante':'Alicante',
};
function normalizeAddressForGeocode(raw){
  return (raw||'')
    .replace(/\bsu\s+nave\b/gi,'')
    .replace(/\bnave\s*\S*/gi,'')
    .replace(/\bgancho\b/gi,'')
    .replace(/\bfrente\s+/gi,'')
    .replace(/\bC\/\s*/gi,'Calle ')
    .replace(/\bAvd\.?\/\s*/gi,'Avenida ')
    .replace(/\bAv\.?\/\s*/gi,'Avenida ')
    .replace(/\bAvda\.?\s*/gi,'Avenida ')
    .replace(/\bPtda\.?\s*/gi,'Partida ')
    .replace(/\b(Plg|Polg)\.?\/?\s*/gi,'Polígono ')
    .replace(/\bUrb\.?\s*/gi,'Urbanización ')
    .replace(/\bPza\.?\s*/gi,'Plaza ')
    .replace(/,\s*,/g,',')
    .replace(/\s{2,}/g,' ')
    .trim().replace(/^,|,$/g,'').trim();
}
// Caja delimitadora aprox. de la comarca de Alicante (evita que "Calle X" encuentre una calle con el mismo nombre en un pueblo lejano de la provincia)
const ALICANTE_VIEWBOX='viewbox=-0.65,38.45,-0.35,38.15&bounded=1';
function geocodeAttempts(addr){
  const base=normalizeAddressForGeocode(addr);
  const parts=base.split(',').map(s=>s.trim()).filter(Boolean);
  const attempts=[];
  if(parts.length>=2){
    const cityRaw=parts[parts.length-1];
    const city=CIUDAD_OFICIAL[cityRaw]||cityRaw;
    const street=parts.slice(0,-1).join(', ');
    if(street) attempts.push({structured:true,street,city});
  }
  attempts.push({structured:false,q:base+', Alicante, España'});
  const parts2=parts.length>2?parts.slice(0,2).join(', '):null;
  if(parts2) attempts.push({structured:false,q:parts2+', Alicante, España'});
  if(parts.length>=3) attempts.push({structured:false,q:parts.slice(-2).join(', ')+', Alicante, España'});
  if(parts.length>0){
    const soloCalle=parts[0].replace(/\balto\s+P?\d+\w*/gi,'').replace(/\bNº?\s*\d+/gi,'').trim();
    if(soloCalle&&soloCalle!==parts[0]) attempts.push({structured:false,q:soloCalle+', Elche, Alicante, España'});
  }
  // Último recurso: si no se encuentra la calle exacta, situar al menos en el centro del municipio correcto
  if(parts.length>=2){
    const cityRaw=parts[parts.length-1];
    const city=CIUDAD_OFICIAL[cityRaw]||cityRaw;
    attempts.push({structured:false,q:city+', Alicante, España',aproximado:true});
  } else {
    attempts.push({structured:false,q:'Alicante, España',aproximado:true});
  }
  return attempts;
}
let geocodeQueueRunning=false;
async function geocodeQueueProcess(addresses,onEach){
  if(geocodeQueueRunning) return;
  geocodeQueueRunning=true;
  for(const addr of addresses){
    if(geoCacheGet(addr)!==undefined){ onEach(); continue; }
    let found=null;
    console.log('%c[GEOCODE] buscando:','color:#1a3a8f;font-weight:bold',addr);
    for(const attempt of geocodeAttempts(addr)){
      try{
        const url=attempt.structured
          ?`https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&countrycodes=es&${ALICANTE_VIEWBOX}&country=España&city=${encodeURIComponent(attempt.city)}&street=${encodeURIComponent(attempt.street)}`
          :`https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&countrycodes=es&${ALICANTE_VIEWBOX}&q=${encodeURIComponent(attempt.q)}`;
        console.log('  → intento:',attempt.structured?`street="${attempt.street}" city="${attempt.city}"`:`q="${attempt.q}"`);
        const res=await fetch(url);
        console.log('    status HTTP:',res.status);
        const data=await res.json();
        if(data&&data[0]){
          console.log('    ✓ encontrado:',data[0].display_name,'→',data[0].lat,data[0].lon,attempt.aproximado?'(APROXIMADO, no la calle exacta)':'');
          found={lat:+data[0].lat,lon:+data[0].lon,aproximado:!!attempt.aproximado};
          break;
        } else {
          console.log('    ✗ sin resultados');
        }
      }catch(e){ console.error('    ✗ error de red:',e); }
      await new Promise(r=>setTimeout(r,700));
    }
    if(!found) console.warn('[GEOCODE] NO localizado tras todos los intentos:',addr);
    geoCacheSet(addr,found);
    onEach();
    await new Promise(r=>setTimeout(r,700));
  }
  geocodeQueueRunning=false;
}
function recalcularUbicaciones(){
  const cache=JSON.parse(localStorage.getItem('garvi_geocode_cache_v4')||'{}');
  Object.keys(cache).forEach(k=>{if(cache[k]===null) delete cache[k];});
  localStorage.setItem('garvi_geocode_cache_v4',JSON.stringify(cache));
  toastMsg('Reintentando localizar direcciones…');
  updateContMapMarkers();
}

let contMapInstance=null, contMapMarkers=[];
const DIRECCIONES_FIJAS={
  'NAVE GARVI':'Calle Rosa de los Vientos, Alicante',
  'GRANJA TORRELLANO':'Torrellano, Elche',
};
// Direcciones confirmadas por el usuario que OpenStreetMap no tiene mapeadas en el sitio correcto:
// mejor sin pin que un pin en el lugar equivocado.
const SIN_GEOCODIFICAR=new Set(['Avd/Salamanca 9, 03005 Alicante']);
function resolveAddress(c){
  const addr=DIRECCIONES_FIJAS[c.cliente]||(c.direccion||'').trim();
  return SIN_GEOCODIFICAR.has(addr)?'':addr;
}
function initContMap(){
  const el=document.getElementById('cont-map');
  if(!el||typeof L==='undefined') return;
  if(contMapInstance){contMapInstance.remove();contMapInstance=null;}
  contMapInstance=L.map('cont-map',{scrollWheelZoom:true}).setView([38.3452,-0.4810],11);
  const calles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  const satelite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(contMapInstance);
  L.control.layers({'🛰️ Satélite':satelite,'🗺️ Calles':calles}).addTo(contMapInstance);
  updateContMapMarkers();
  // El contenedor puede no tener aún su tamaño final al crear el mapa (sobre todo en móvil) → recalcular tras el layout
  setTimeout(()=>{ if(contMapInstance) contMapInstance.invalidateSize(); },150);
  setTimeout(()=>{ if(contMapInstance) contMapInstance.invalidateSize(); },600);
  if(!window._contMapResizeBound){
    window._contMapResizeBound=true;
    window.addEventListener('resize',()=>{ if(contMapInstance) contMapInstance.invalidateSize(); });
    window.addEventListener('orientationchange',()=>{ setTimeout(()=>{ if(contMapInstance) contMapInstance.invalidateSize(); },300); });
  }
}
function updateContMapMarkers(){
  if(!contMapInstance) return;
  contMapMarkers.forEach(m=>contMapInstance.removeLayer(m));
  contMapMarkers=[];
  const withDir=containers.filter(c=>resolveAddress(c));
  const groups={};
  withDir.forEach(c=>{
    const addr=resolveAddress(c);
    (groups[addr]=groups[addr]||[]).push(c);
  });
  Object.entries(groups).forEach(([addr,group])=>{
    const cached=geoCacheGet(addr);
    if(!cached||!cached.lat) return;
    const count=group.length;
    const aprox=cached.aproximado?' ⚠️':'';
    const icon=L.divIcon({className:'',html:`<div class="cont-pin${cached.aproximado?' cont-pin-aprox':''}"><span>${count>1?count:'📦'}</span></div>`,iconSize:[36,36],iconAnchor:[18,36]});
    const marker=L.marker([cached.lat,cached.lon],{icon}).addTo(contMapInstance);
    if(count===1){
      const c=group[0];
      marker.bindTooltip(`#${c.num} · ${c.cliente}${aprox?' (ubicación aproximada)':''}`);
      marker.on('click',()=>openContainerModal(c.num));
    } else {
      marker.bindTooltip(`${group[0].cliente} · ${count} contenedores${aprox?' (ubicación aproximada)':''}`);
      marker.on('click',()=>{
        searchQ=group[0].cliente;
        const si=document.getElementById('cont-search'); if(si) si.value=searchQ;
        updateContList();
        const lc=document.getElementById('cont-list-card'); if(lc) lc.scrollIntoView({behavior:'smooth',block:'nearest'});
        toastMsg(`Mostrando ${count} contenedores de ${group[0].cliente}`);
      });
    }
    contMapMarkers.push(marker);
  });
  const statusEl=document.getElementById('cont-map-status');
  const uniqAddrs=Object.keys(groups);
  const pendientes=uniqAddrs.filter(a=>geoCacheGet(a)===undefined);
  if(pendientes.length){
    if(statusEl) statusEl.textContent=`Localizando direcciones… (${uniqAddrs.length-pendientes.length}/${uniqAddrs.length})`;
    geocodeQueueProcess(pendientes,()=>{ if(currentTab==='contenedores') updateContMapMarkers(); });
  } else if(statusEl){
    statusEl.textContent=`${withDir.length} contenedor(es) en ${uniqAddrs.length} ubicaciones`;
  }
}

  doc.rect(bx+5*s,by+30.5*s,13.5*s,4.5*s,'F');
  doc.triangle(bx+39*s,by+11*s,bx+34.5*s,by+13.5*s,bx+23*s,by+36*s,'F');
  doc.triangle(bx+23*s,by+23*s,bx+18*s,by+22*s,bx+23*s,by+36*s,'F');
}

function pdfAlbaran(id){
  const a=albaranes.find(x=>x.id===id); if(!a) return;
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a5'});
  const W=148;
  // Barra superior
  doc.setFillColor(240,180,41); doc.rect(0,0,W,4,'F');
  // Logo PNG
  try{doc.addImage('data:image/png;base64,'+PRES_LOGO_B64,'PNG',8,6,12,12);}catch(e){}
  // Empresa
  doc.setTextColor(15,32,68); doc.setFontSize(9); doc.setFont('helvetica','bold');
  doc.text('GARVI RECYCLING SYSTEMS, S.L.U.',23,11);
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(74,96,128);
  doc.text('Ptda.Torrellano alto P1, Nº76 · C.P.03320 Elche · CIF: B54970439',23,16);
  doc.text('Tel: 687759465 / 634537926 · contenedores-garvi@hotmail.com',23,20);
  // Título
  doc.setDrawColor(200,212,227); doc.line(8,24,140,24);
  doc.setTextColor(15,32,68); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('ALBARÁN DE SERVICIO',W/2,31,{align:'center'});
  // Datos principales
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  const col1=8, col2=80;
  const fila=(label,val,x,y,label2,val2)=>{
    doc.setTextColor(74,96,128); doc.text(label+':',x,y);
    doc.setTextColor(15,32,68); doc.setFont('helvetica','bold'); doc.text(val||'—',x+18,y);
    doc.setFont('helvetica','normal');
    if(label2!==undefined){doc.setTextColor(74,96,128);doc.text(label2+':',col2,y);doc.setTextColor(15,32,68);doc.setFont('helvetica','bold');doc.text(val2||'—',col2+16,y);doc.setFont('helvetica','normal');}
  };
  let y=40;
  fila('Nº',a.num||'',col1,y,'Fecha',fmtDate(a.fecha)); y+=7;
  fila('Hora',a.hora||'—',col1,y,'Servicio',a.servicio||''); y+=7;
  doc.setDrawColor(200,212,227); doc.line(8,y-2,140,y-2); y+=2;
  fila('Cliente',a.cliente||'',col1,y,'Tel',a.telefono||''); y+=7;
  fila('Lugar',a.lugar||'',col1,y,'Población',a.poblacion||''); y+=7;
  fila('Conductor',a.conductor||'',col1,y,'Cont. nº',a.contenedor||''); y+=7;
  fila('Destinatario',a.destinatario||'',col1,y,'Tipo',a.tipo||''); y+=7;
  doc.setDrawColor(200,212,227); doc.line(8,y-2,140,y-2); y+=2;
  if(a.descripcion){
    doc.setTextColor(74,96,128); doc.setFontSize(7.5); doc.text('Observaciones:',col1,y); y+=5;
    doc.setTextColor(15,32,68); doc.setFontSize(8);
    const obs=doc.splitTextToSize(a.descripcion,130);
    doc.text(obs,col1,y); y+=obs.length*4+4;
  }
  // Precio
  if(a.precio){
    doc.setDrawColor(200,212,227); doc.line(8,y,140,y); y+=6;
    doc.setTextColor(74,96,128); doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('PRECIO:',col1,y); doc.setTextColor(15,32,68); doc.text(fmtMoney(parseFloat(a.precio)||0)+' + IVA',col1+20,y); y+=8;
  }
  // Firma
  y=Math.max(y,155);
  doc.setDrawColor(200,212,227); doc.line(8,y,60,y); doc.line(80,y,140,y);
  y+=5;
  doc.setTextColor(74,96,128); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
  doc.text('Firma / DNI',8,y); doc.text('Recibí conforme',80,y);
  // Barra inferior
  doc.setFillColor(240,180,41); doc.rect(0,204,W,4,'F');
  doc.save(`albaran-${a.num||a.id}.pdf`);
}

function renderLineas(){
  const tbody=document.getElementById('lineas-body');
  if(!tbody) return;
  tbody.innerHTML=factLineas.map((l,i)=>{
    const sub=(l.qty||0)*(l.precio||0)*(1+(l.iva||21)/100);
    return `<tr data-idx="${i}">
      <td><input value="${l.desc||''}" data-action="edit-linea" data-field="desc" data-idx="${i}" style="min-width:90px;font-size:12px"></td>
      <td><input type="number" inputmode="decimal" value="${l.qty||1}" data-action="edit-linea" data-field="qty" data-idx="${i}" style="width:46px;font-size:12px"></td>
      <td><input type="number" inputmode="decimal" value="${l.precio||0}" data-action="edit-linea" data-field="precio" data-idx="${i}" style="width:65px;font-size:12px"></td>
      <td><input type="number" inputmode="decimal" value="${l.iva||21}" data-action="edit-linea" data-field="iva" data-idx="${i}" style="width:42px;font-size:12px"></td>
      <td class="linea-sub" style="text-align:right;font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);white-space:nowrap">${fmtMoney(sub)}</td>
      <td><button class="btn btn-danger btn-sm btn-icon" data-action="del-linea" data-idx="${i}" style="width:28px;height:28px;font-size:12px">✕</button></td>
    </tr>`;}).join('');
  renderTotales();
}
function renderTotales(){
  const box=document.getElementById('totales-box');
  if(!box) return;
  let base=0,ivaTotal=0;
  factLineas.forEach(l=>{
    const b=(l.qty||0)*(l.precio||0);
    base+=b;
    ivaTotal+=b*(l.iva||21)/100;
  });
  const total=base+ivaTotal;
  box.innerHTML=`
    <div class="total-row"><span>Base imponible</span><span style="font-family:'DM Mono',monospace">${fmtMoney(base)}</span></div>
    <div class="total-row"><span>IVA</span><span style="font-family:'DM Mono',monospace">${fmtMoney(ivaTotal)}</span></div>
    <div class="total-row grand"><span>TOTAL</span><span>${fmtMoney(total)}</span></div>`;
}

function loadFacturaDraft(){

  }catch(e){return null;}

function clearFacturaDraft(){localStorage.removeItem('garvi_factura_draft');}
function editLinea(idx,field,val){
  if(field==='qty'||field==='precio'||field==='iva') factLineas[idx][field]=Number(val);
  else factLineas[idx][field]=val;
  const l=factLineas[idx];
  const row=document.querySelector(`#lineas-body tr[data-idx="${idx}"]`);
  if(row){
    const sub=(l.qty||0)*(l.precio||0)*(1+(l.iva||21)/100);
    const cell=row.querySelector('.linea-sub');
    if(cell) cell.textContent=fmtMoney(sub);
  }
  renderTotales();
}
function delLinea(idx){factLineas.splice(idx,1);renderLineas();saveFacturaDraft();}
function guardarFactura(){
  if(!factLineas.length){toastMsg('Añade al menos una línea');return;}
  const cliente=(document.getElementById('f-cliente').value||'').trim();
  if(!cliente){toastMsg('Indica el cliente');return;}
  let base=0,ivaTotal=0;
  factLineas.forEach(l=>{const b=(l.qty||0)*(l.precio||0);base+=b;ivaTotal+=b*(l.iva||21)/100;});
  const total=base+ivaTotal;
  const isProf=factMode==='proforma';
  const datos={
    tipo:factMode,cliente,
    num:document.getElementById('f-num').value.trim(),
    fecha:document.getElementById('f-fecha').value,
    vencimiento:factMode==='factura'?(document.getElementById('f-venc')||{}).value||'':'',
    nif:document.getElementById('f-nif').value.trim(),
    dir:document.getElementById('f-dir').value.trim(),
    telefono:document.getElementById('f-tel').value.trim(),
    email:document.getElementById('f-email').value.trim(),
    notas:document.getElementById('f-notas').value.trim(),
    lineas:factLineas.map(l=>({...l})),
    base,iva:ivaTotal,total,
  };
  if(editFactId){
    const f=facturas.find(x=>x.id===editFactId);
    if(f) Object.assign(f,datos);
  } else {
    if(isProf) cfg.ultimaProf=(cfg.ultimaProf||0)+1;
    else cfg.ultimaFact=(cfg.ultimaFact||0)+1;
    saveCfg();
    facturas.push({id:Date.now().toString(),...datos});
  }
  saveFacturas();clearFacturaDraft();closeModal();renderFacturas();toastMsg('Factura guardada ✓');
}
function buildTmpFactura(){
  let base=0,ivaTotal=0;

  };
}

function pdfListGenerico(titulo,headers,rows,filename){
  if(!rows.length){toastMsg('No hay datos para exportar');return;}
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210;
  doc.setFillColor(240,180,41); doc.rect(0,0,W,5,'F');
  try{doc.addImage('data:image/png;base64,'+PRES_LOGO_B64,'PNG',10,8,16,16);}catch(e){}
  doc.setTextColor(15,32,68); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('GARVI RECYCLING SYSTEMS, S.L.U.',29,15);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(74,96,128);
  doc.text('Ptda.Torrellano alto P1, Nº76 · C.P.03320 Elche (Alicante) · CIF: B54970439',29,21);
  doc.setTextColor(240,180,41); doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text(titulo.toUpperCase(),196,18,{align:'right'});
  doc.setTextColor(74,96,128); doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text('Fecha: '+fmtDate(todayISO()),196,26,{align:'right'});
  doc.setDrawColor(200,212,227); doc.line(14,32,196,32);
  let cy=40;
  const colW=182/headers.length;
  const printHeader=()=>{
    doc.setFillColor(15,32,68); doc.rect(14,cy-5,182,7,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont('helvetica','bold');
    headers.forEach((h,i)=>doc.text(h,16+colW*i,cy));
    cy+=7;
  };
  printHeader();
  doc.setFont('helvetica','normal');
  rows.forEach((r,idx)=>{
    if(cy>270){doc.addPage();cy=20;printHeader();}
    if(idx%2===0){doc.setFillColor(240,244,248);doc.rect(14,cy-4,182,7,'F');}
    doc.setTextColor(15,32,68); doc.setFontSize(8);
    r.forEach((v,i)=>doc.text(String(v??''),16+colW*i,cy,{maxWidth:colW-2}));
    cy+=7;
  });
  doc.setFillColor(240,180,41); doc.rect(0,292,W,5,'F');
  doc.save(filename);
}
