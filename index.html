<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0b429">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<title>GARVI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f8fafc;
  --sidebar-bg:#0f2044;--sidebar-w:220px;--sidebar-w-sm:64px;
  --accent:#f0b429;--accent2:#d69f20;--accent-blue:#1a3a8f;
  --text:#0f2044;--text2:#4a6080;--muted:#8fa3c0;
  --border:#e2e8f0;--border2:#e8eef6;
  --shadow:0 2px 8px rgba(15,32,68,.08);--shadow-md:0 4px 20px rgba(15,32,68,.12);
  --danger:#dc2626;--success:#16a34a;--warn:#d97706;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow-x:hidden}

/* ── SIDEBAR ───────────────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:var(--sidebar-bg);display:flex;flex-direction:column;
  z-index:100;overflow:hidden;
}
.sidebar-logo{
  padding:22px 18px 18px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
}
.sidebar-logo-icon{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-logo-name{font-size:19px;font-weight:800;color:#fff;letter-spacing:.5px;line-height:1}
.sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.38);margin-top:3px;white-space:nowrap}
.sidebar-nav{flex:1;padding:10px 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.tab-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:11px 18px;
  background:none;border:none;border-left:3px solid transparent;
  color:rgba(255,255,255,.5);font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;text-align:left;
  min-height:44px;position:relative;
}
.tab-btn:hover{background:rgba(240,180,41,.1);color:var(--accent)}
.tab-btn.active{background:rgba(240,180,41,.16);border-left-color:var(--accent);color:var(--accent);font-weight:700}
.tab-icon{flex-shrink:0;width:22px;height:20px;display:flex;align-items:center;justify-content:center}
.tab-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.badge{
  background:#dc2626;color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;flex-shrink:0;
}
.sidebar-footer{
  padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;flex-shrink:0;overflow:hidden;
}
.sidebar-avatar{
  width:32px;height:32px;background:var(--accent);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--sidebar-bg);flex-shrink:0;
}
#sidebar-username{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sidebar-logout{
  background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;
  font-size:18px;padding:4px;line-height:1;transition:color .15s;flex-shrink:0;
}
.sidebar-logout:hover{color:#fca5a5}

/* ── LAYOUT ────────────────────────────────────────── */
#app{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .2s}
.section{display:none;padding:28px 32px;width:100%;box-sizing:border-box}
.section.active{display:block}
.section-header{position:sticky;top:0;z-index:50;background:var(--bg);padding:16px 0 10px;margin-bottom:16px}
.section-title{font-size:22px;font-weight:800;color:var(--text)}

/* Tablet: solo iconos */
@media(max-width:1023px) and (min-width:768px){
  #nav{width:var(--sidebar-w-sm)}
  #app{margin-left:var(--sidebar-w-sm)}
  .sidebar-logo-sub,.sidebar-logo-name,.tab-label,#sidebar-username,.sidebar-logout{display:none}
  .sidebar-logo{padding:14px;justify-content:center}
  .tab-btn{padding:13px;justify-content:center;border-left:none;border-bottom:3px solid transparent}
  .tab-btn.active{border-bottom-color:var(--accent);border-left-color:transparent}
  .sidebar-footer{padding:10px;justify-content:center}
  .sidebar-avatar{width:36px;height:36px}
}

/* Móvil: bottom nav */
@media(max-width:767px){
  #nav{
    width:100%;height:60px;
    top:auto;bottom:0;left:0;right:0;
    flex-direction:row;
    background:var(--surface);
    border-top:1px solid var(--border);
    box-shadow:0 -2px 12px rgba(15,32,68,.08);
  }
  .sidebar-logo,.sidebar-footer{display:none}
  .sidebar-nav{display:flex;flex-direction:row;width:100%;padding:0;overflow:visible}
  .tab-btn{
    flex:1;flex-direction:column;gap:3px;
    padding:5px 2px;justify-content:center;align-items:center;
    border-left:none;border-top:2px solid transparent;
    color:var(--muted);font-size:10px;min-height:unset;
  }
  .tab-btn.active{color:var(--accent);border-top-color:var(--accent);background:rgba(240,180,41,.05)}
  .tab-btn:hover{background:rgba(240,180,41,.05);color:var(--accent)}
  .tab-icon{width:auto;height:24px}
  .badge{position:absolute;top:4px;right:calc(50% - 18px);margin:0}
  #app{margin-left:0;padding-bottom:64px}
  .section{padding:16px}
  .section-header{top:0}
}

/* ── LOGIN ─────────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#login-screen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#e8f0fe 0%,#f0f4f8 60%,#fef9ec 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:999;animation:fadeIn .4s ease;
}
.login-box{
  background:var(--surface);border-radius:20px;
  box-shadow:0 8px 40px rgba(15,32,68,.14);
  padding:40px 36px;width:min(400px,94vw);
  animation:scaleIn .4s ease;
}
.login-logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.login-logo-icon{
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 4px 14px rgba(240,180,41,.4));
}
.login-logo-name{font-size:28px;font-weight:800;color:var(--text);letter-spacing:.5px}
.login-logo-sub{font-size:12px;color:var(--muted);margin-top:2px}
.login-err{color:#dc2626;font-size:13px;margin-top:6px;min-height:18px;font-weight:500}

/* ── FORMS ─────────────────────────────────────────── */
input,select,textarea{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);font-family:inherit;
  font-size:14px;padding:10px 14px;width:100%;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(240,180,41,.15);
}
select option{background:var(--surface)}
label{
  display:block;font-size:11px;color:#6a84aa;
  margin-bottom:5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;
}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.form-row.cols2{grid-template-columns:1fr 1fr}
.form-row.cols3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){.form-row.cols2,.form-row.cols3{grid-template-columns:1fr}}

/* ── BUTTONS ───────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 18px;border-radius:10px;border:none;
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
  transition:all .15s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--sidebar-bg)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--surface);color:var(--accent-blue);border:2px solid var(--accent-blue)}
.btn-secondary:hover{background:var(--accent-blue);color:#fff}
.btn-danger{background:var(--surface);color:#dc2626;border:1.5px solid #fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;font-size:15px}
.btn-full{width:100%}

/* ── CARDS ─────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:16px;margin-bottom:10px;
  box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}

/* ── CONTENEDOR ROWS ───────────────────────────────── */
/* ── LISTA CONTENEDORES ─────────────────────────────── */
#cont-list{
  background:#fff;border-radius:14px;
  border:1px solid var(--border2);overflow:hidden;
  box-shadow:var(--shadow);
}
.cont-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:#fff;border-bottom:1px solid #f1f5f9;
  cursor:pointer;transition:background .12s;
}
.cont-row:last-child{border-bottom:none}
.cont-row:hover{background:#f8fafc}
.cont-num{
  font-family:'DM Mono',monospace;font-size:12px;font-weight:700;
  width:44px;height:44px;flex-shrink:0;
  border-radius:10px;text-align:center;
  display:flex;align-items:center;justify-content:center;
}
.s-normal{background:#1e3a8a;color:#fff}
.s-buenos{background:#14532d;color:#fff}
.s-aptos{background:#365314;color:#fff}
.s-reparados{background:#581c87;color:#fff}
.s-rotos{background:#7f1d1d;color:#fff}
.s-rotos_granja{background:#78350f;color:#fff}
.cont-info{flex:1;min-width:0}
.cont-cliente{font-weight:700;font-size:15px;color:#0f2044;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-detail{font-size:12px;color:#6a84aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.days-badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.days-ok{background:#dcfce7;color:#166534}
.days-warn{background:#fef3c7;color:#92400e}
.days-danger{background:#fee2e2;color:#991b1b}

/* ── DASHBOARD ─────────────────────────────────────── */
.dash-wrap{
  background:linear-gradient(135deg,var(--accent-blue) 0%,#0f2044 100%);
  border-radius:18px;padding:20px 22px;margin-bottom:18px;
  box-shadow:0 4px 24px rgba(26,58,143,.2);
}
.dash-greeting{font-size:22px;font-weight:800;color:#fff}
.dash-date{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:18px;text-transform:capitalize}
.dash-metrics{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dash-metrics::-webkit-scrollbar{display:none}
.dash-metric{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:12px;padding:12px 16px;flex-shrink:0;min-width:100px;
  cursor:pointer;transition:all .15s;backdrop-filter:blur(4px);
}
.dash-metric:hover{background:rgba(255,255,255,.18)}
.dash-metric-val{font-size:28px;font-weight:900;color:var(--accent);font-family:'DM Mono',monospace;line-height:1}
.dash-metric-label{font-size:11px;color:rgba(255,255,255,.55);font-weight:500;margin-top:4px}

/* ── STATE FILTER CHIPS ────────────────────────────── */
.state-cards{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}
.state-cards::-webkit-scrollbar{display:none}
.state-card{
  flex-shrink:0;padding:5px 12px;border-radius:20px;cursor:pointer;
  font-size:12px;font-weight:600;transition:all .15s;
  border:2px solid transparent;opacity:.7;
}
.state-card:hover{opacity:1;transform:translateY(-1px)}
.state-card.active{opacity:1;border-color:rgba(0,0,0,.25);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.state-card.inactive{opacity:.6}

/* ── VISTA TABS (Todos/Próximos/Retirar) ───────────── */
.view-tabs{display:flex;gap:6px;margin-bottom:12px}
.view-tab{
  padding:7px 16px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text2);
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
}
.view-tab:hover{border-color:var(--accent-blue);color:var(--accent-blue)}
.view-tab.active-all{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}
.view-tab.active-prox{background:#d97706;color:#fff;border-color:#d97706}
.view-tab.active-ret{background:#dc2626;color:#fff;border-color:#dc2626}

/* ── SEARCH ────────────────────────────────────────── */
.search-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search-input{
  flex:1;padding:10px 14px;font-size:14px;
  border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface);box-shadow:var(--shadow);
}

/* ── MODAL ─────────────────────────────────────────── */
#modal-overlay{
  position:fixed;inset:0;background:rgba(15,32,68,.45);
  backdrop-filter:blur(3px);z-index:200;display:none;
  align-items:flex-end;justify-content:center;
}
@media(min-width:768px){#modal-overlay{align-items:center}}
#modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border-radius:20px 20px 0 0;
  width:100%;max-width:620px;max-height:92vh;overflow-y:auto;
  padding:22px;animation:slideUp .25s ease;
  box-shadow:0 -4px 40px rgba(15,32,68,.15);
}
@media(min-width:768px){.modal{border-radius:20px;max-height:88vh;animation:scaleIn .2s ease}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:17px;font-weight:800;color:var(--text)}

/* ── FACTURA TOGGLE ────────────────────────────────── */
.fact-toggle{
  display:flex;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:3px;margin-bottom:16px;gap:3px;
}
.fact-toggle-btn{
  flex:1;padding:9px;border:none;border-radius:8px;
  background:none;color:var(--muted);font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;
}
.fact-toggle-btn.active{background:var(--accent);color:var(--sidebar-bg);box-shadow:0 2px 8px rgba(240,180,41,.3)}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.qbtn{
  display:flex;flex-direction:column;align-items:flex-start;
  padding:9px 13px;border-radius:10px;
  border:1.5px solid rgba(26,58,143,.2);background:var(--surface2);
  color:var(--text);font-family:inherit;cursor:pointer;transition:all .15s;
  min-width:130px;text-align:left;box-shadow:var(--shadow);
}
.qbtn:hover{background:var(--accent);border-color:var(--accent);color:var(--sidebar-bg);box-shadow:0 3px 12px rgba(240,180,41,.3);transform:translateY(-1px)}
.qbtn:hover .qbtn-price{color:var(--sidebar-bg)}
.qbtn-name{font-size:12px;font-weight:700;line-height:1.3;color:inherit}
.qbtn-price{font-size:11px;color:var(--accent-blue);margin-top:4px;font-family:'DM Mono',monospace}
.qbtn-tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.qbtn-tab{
  padding:5px 14px;border-radius:20px;
  border:1.5px solid var(--border);background:var(--surface2);
  color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.qbtn-tab.active{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}
.lineas-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:13px}
.lineas-table th{
  text-align:left;padding:8px 10px;background:var(--accent-blue);
  color:#fff;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;
}
.lineas-table th:first-child{border-radius:8px 0 0 8px}
.lineas-table th:last-child{border-radius:0 8px 8px 0}
.lineas-table tr:nth-child(even) td{background:var(--surface2)}
.lineas-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.lineas-table input{
  padding:5px 8px;font-size:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
}
.totales-box{
  background:linear-gradient(135deg,#eff6ff,#f0f9ff);
  border:1.5px solid #bfdbfe;border-radius:12px;
  padding:16px;margin-top:12px;
}
.total-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--text2)}
.total-row.grand{
  color:var(--accent-blue);font-weight:800;font-size:19px;
  border-top:2px solid #bfdbfe;margin-top:10px;padding-top:12px;
  font-family:'DM Mono',monospace;
}

/* ── ALBARANES ─────────────────────────────────────── */
.albaran-ticket{
  background:var(--surface);border:1px solid var(--border2);
  border-left:4px solid var(--accent);border-radius:12px;
  padding:14px;margin-bottom:8px;box-shadow:var(--shadow);
}
.albaran-ticket-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.albaran-ticket-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent-blue);font-weight:700}
.albaran-ticket-date{font-size:11px;color:var(--muted)}
.albaran-ticket-title{font-weight:700;font-size:14px;color:var(--text);margin-bottom:3px}
.albaran-ticket-detail{font-size:12px;color:var(--muted)}
.albaran-ticket-actions{display:flex;gap:6px;margin-top:10px}

/* ── FACTURAS LIST ─────────────────────────────────── */
.factura-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:var(--surface);
  border:1px solid var(--border2);border-radius:12px;
  margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);
  transition:all .15s;
}
.factura-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.fact-badge{font-family:'DM Mono',monospace;font-size:11px;padding:4px 9px;border-radius:6px;font-weight:700;flex-shrink:0}
.fact-badge-p{background:#dbeafe;color:#1e40af}
.fact-badge-f{background:#dcfce7;color:#166534}
.fact-info{flex:1;min-width:0}
.fact-cliente{font-weight:700;font-size:14px;color:var(--text)}
.fact-meta{font-size:12px;color:var(--muted);margin-top:2px}
.fact-total{font-family:'DM Mono',monospace;font-size:15px;color:var(--accent-blue);font-weight:800}

/* ── CLIENTES ──────────────────────────────────────── */
.cliente-item{
  padding:14px 16px;background:var(--surface);
  border:1px solid var(--border2);border-radius:12px;
  margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);
  transition:all .15s;
}
.cliente-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-left:3px solid var(--accent)}
.cliente-nombre{font-weight:700;font-size:14px;color:var(--text);margin-bottom:5px}
.cliente-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}

/* ── TAREAS ────────────────────────────────────────── */
.tarea-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;background:var(--surface);
  border:1px solid var(--border2);border-radius:12px;
  margin-bottom:8px;box-shadow:var(--shadow);
}
.tarea-check{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;margin-top:1px;transition:all .15s;
}
.tarea-check.done{background:var(--success);border-color:var(--success);color:#fff}
.tarea-body{flex:1}
.tarea-titulo{font-size:14px;font-weight:500;color:var(--text);transition:opacity .15s}
.tarea-titulo.done{opacity:.45;text-decoration:line-through}
.tarea-meta{font-size:11px;color:var(--muted);margin-top:2px}

/* ── FINANZAS ──────────────────────────────────────── */
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.fin-sum-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow);
}
.fin-sum-val{font-size:22px;font-weight:800;font-family:'DM Mono',monospace}
.fin-sum-label{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── MISC ──────────────────────────────────────────── */
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .icon{font-size:44px;margin-bottom:10px}
.photo-thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--border)}
.photos-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--surface2);border:1px solid var(--border)}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--sidebar-bg);color:#fff;border-radius:10px;
  padding:10px 20px;font-size:13px;font-weight:600;z-index:999;
  opacity:0;transition:opacity .2s;pointer-events:none;
  box-shadow:0 4px 20px rgba(15,32,68,.3);
}
.toast.show{opacity:1}
@media(min-width:768px){.toast{bottom:24px}}
/* ── PRESUPUESTOS ─────────────────────────────────── */
.pres-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:720px){.pres-layout{grid-template-columns:1fr}}
.cat-row{display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12px}
.cat-row:last-child{border-bottom:none}
.cat-name{flex:1;color:var(--text);font-weight:600}
.cat-iva{color:var(--muted);font-size:11px;flex-shrink:0;white-space:nowrap}
.cat-price-inp{width:65px!important;padding:4px 6px!important;font-size:12px!important;text-align:right}
.pres-list{list-style:none;margin:0;padding:0;font-size:13px}
.pres-list li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border)}
.pres-list li:last-child{border-bottom:none}
.pres-item-name{flex:1;color:var(--text);font-size:12px}
.pres-item-price{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent-blue);white-space:nowrap;flex-shrink:0}
.pres-preview-wrap{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.doc-preview{border:1.5px solid var(--border2);border-radius:10px;padding:26px;font-size:13px;line-height:1.55;background:#fff;color:#222}
.doc-preview .doc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;border-bottom:2px solid #1a2a6c;padding-bottom:12px}
.doc-logo-box{background:#07235c;border-radius:8px;padding:8px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-logo-box img{width:48px;height:48px;display:block}
.doc-title-right{text-align:right}
.doc-title-right h3{color:#1a2a6c;margin:0;font-size:19px;font-weight:800}
.doc-title-right p{font-size:11px;color:#555;margin:2px 0 0}
.doc-meta-line{font-size:12px;margin-bottom:14px;color:#333}
.doc-meta-line strong{color:#1a2a6c}
.doc-concepts-list{margin:8px 0 14px;padding-left:18px}
.doc-concepts-list li{margin-bottom:5px;font-size:13px;color:#222}
.doc-concepts-list li b{color:#1a2a6c}
.doc-sign-wrap{display:flex;justify-content:flex-end;margin-top:24px}
.doc-sign-wrap img{width:200px;display:block;margin:0 auto 4px}
.doc-sign-name{font-size:11px;color:#333;text-align:center}

function loadData(){
  const raw=localStorage.getItem(LSKEY);
  if(raw){containers=JSON.parse(raw);}
  else{containers=INIT.map(c=>({...c}));saveContainers();}
  albaranes=JSON.parse(localStorage.getItem('garvi_albaranes')||'[]');
  tareas=JSON.parse(localStorage.getItem('garvi_tareas')||'[]');
  finanzas=JSON.parse(localStorage.getItem('garvi_finanzas')||'[]');
  facturas=JSON.parse(localStorage.getItem('garvi_facturas')||'[]');
  cfg=JSON.parse(localStorage.getItem('garvi_cfg')||'{"apiKey":"","ultimaFact":0,"ultimaProf":0}');
  syncClientes();
}
function saveContainers(){localStorage.setItem(LSKEY,JSON.stringify(containers));}
function saveAlbaranes(){localStorage.setItem('garvi_albaranes',JSON.stringify(albaranes));}
function saveTareas(){localStorage.setItem('garvi_tareas',JSON.stringify(tareas));}
function saveFinanzas(){localStorage.setItem('garvi_finanzas',JSON.stringify(finanzas));}
function saveFacturas(){localStorage.setItem('garvi_facturas',JSON.stringify(facturas));}
function saveCfg(){localStorage.setItem('garvi_cfg',JSON.stringify(cfg));}

function getClienteExtra(nombre){const m=JSON.parse(localStorage.getItem('garvi_clientes_extra')||'{}');return m[nombre]||{};}
function saveClienteExtra(nombre,data){const m=JSON.parse(localStorage.getItem('garvi_clientes_extra')||'{}');m[nombre]={...(m[nombre]||{}),...data};localStorage.setItem('garvi_clientes_extra',JSON.stringify(m));}
function syncClientes(){
  const mapa={};
  containers.forEach(c=>{
    const nom=c.cliente;
    if(!nom||nom==='NAVE GARVI'||nom==='GRANJA TORRELLANO') return;
    const ex=getClienteExtra(nom);
    if(!mapa[nom]) mapa[nom]={id:'cl-'+nom.toLowerCase().replace(/\s+/g,'-'),nombre:nom,telefono:c.telefono||'',direccion:c.direccion||'',dirFacturacion:ex.dirFacturacion||'',cif:ex.cif||'',contenedores:[],fechaUltimoServicio:'',totalServicios:0,notas:''};
    const cl=mapa[nom];
    if(c.telefono&&!cl.telefono) cl.telefono=c.telefono;
    if(!cl.contenedores.includes(c.num)) cl.contenedores.push(c.num);
    if(!cl.fechaUltimoServicio||c.fecha>cl.fechaUltimoServicio) cl.fechaUltimoServicio=c.fecha;
    cl.totalServicios=cl.contenedores.length;
  });
  clientes=Object.values(mapa).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  localStorage.setItem('garvi_clientes_v1',JSON.stringify(clientes));
}

function getContainer(num){return containers.find(c=>c.num===num);}
function daysSince(fecha){
  if(!fecha) return 0;
  return Math.floor((Date.now()-new Date(fecha).getTime())/86400000);
}
function fmtFecha(f){
  if(!f) return '—';
  var p=f.split('-');
  return p[2]+'/'+p[1]+'/'+p[0].slice(2);
}
function daysBadge(dias,fecha){
  const cls=dias<11?'days-ok':dias<14?'days-warn':'days-danger';
  return `<span class="days-badge ${cls}">${fmtFecha(fecha)}</span>`;
}
function fmtDate(iso){if(!iso) return '';const d=new Date(iso);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function fmtMoney(n){return Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+'€';}
function fmtPresPrice(n){const v=Number(n||0);return v.toLocaleString('es-ES',{minimumFractionDigits:v%1===0?0:2,maximumFractionDigits:2})+'€';}
function fmtPresDate(iso){if(!iso)return '—';const[y,m,d]=iso.split('-');return`${d}-${m}-${y}`;}
function toastMsg(msg,ms=2200){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}

function pdfAlbaran(id){
  const a=albaranes.find(x=>x.id===id); if(!a) return;
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a5'});
  const W=148;
  // Barra superior
  doc.setFillColor(240,180,41); doc.rect(0,0,W,4,'F');
  // Logo PNG
  try{doc.addImage('data:image/png;base64,'+PRES_LOGO_B64,'PNG',8,6,12,12);}catch(e){}
  // Empresa
  doc.setTextColor(15,32,68); doc.setFontSize(9); doc.setFont('helvetica','bold');
  doc.text('GARVI RECYCLING SYSTEMS, S.L.U.',23,11);
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(74,96,128);
  doc.text('Ptda.Torrellano alto P1, Nº76 · C.P.03320 Elche · CIF: B54970439',23,16);
  doc.text('Tel: 687759465 / 634537926 · contenedores-garvi@hotmail.com',23,20);
  // Título
  doc.setDrawColor(200,212,227); doc.line(8,24,140,24);
  doc.setTextColor(15,32,68); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('ALBARÁN DE SERVICIO',W/2,31,{align:'center'});
  // Datos principales
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  const col1=8, col2=80;
  const fila=(label,val,x,y,label2,val2)=>{
    doc.setTextColor(74,96,128); doc.text(label+':',x,y);
    doc.setTextColor(15,32,68); doc.setFont('helvetica','bold'); doc.text(val||'—',x+18,y);
    doc.setFont('helvetica','normal');
    if(label2!==undefined){doc.setTextColor(74,96,128);doc.text(label2+':',col2,y);doc.setTextColor(15,32,68);doc.setFont('helvetica','bold');doc.text(val2||'—',col2+16,y);doc.setFont('helvetica','normal');}
  };
  let y=40;
  fila('Nº',a.num||'',col1,y,'Fecha',fmtDate(a.fecha)); y+=7;
  fila('Hora',a.hora||'—',col1,y,'Servicio',a.servicio||''); y+=7;
  doc.setDrawColor(200,212,227); doc.line(8,y-2,140,y-2); y+=2;
  fila('Cliente',a.cliente||'',col1,y,'Tel',a.telefono||''); y+=7;

  doc.setDrawColor(200,212,227); doc.line(8,y,60,y); doc.line(80,y,140,y);
  y+=5;

  doc.text('Firma / DNI',8,y); doc.text('Recibí conforme',80,y);

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(74,96,128);

  doc.text('contenedores-garvi@hotmail.com  ·  www.contenedoresalicante.es',29,31);

  doc.setTextColor(240,180,41); doc.setFontSize(20); doc.setFont('helvetica','bold');

  doc.setTextColor(74,96,128); doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(`Nº: ${f.num||''}`,196,26,{align:'right'});
  doc.text(`Emisión: ${fmtDate(f.fecha)}`,196,32,{align:'right'});
  // Línea divisoria
  doc.setDrawColor(200,212,227); doc.line(14,40,196,40);
  // Bloque CLIENTE
  let cy=46;
  doc.setTextColor(74,96,128); doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.text('FACTURAR A',14,cy); cy+=6;
  doc.setTextColor(15,32,68); doc.setFontSize(11); doc.setFont('helvetica','bold');

  if(contactLine){doc.setTextColor(15,32,68);doc.text(contactLine,14,cy);cy+=5;}
  cy=Math.max(cy,70);
  doc.setDrawColor(200,212,227); doc.line(14,cy,196,cy); cy+=6;
  // Cabecera tabla
  doc.setFillColor(15,32,68); doc.rect(14,cy-4,182,8,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text('DESCRIPCIÓN',16,cy);
  doc.text('CANT.',116,cy,{align:'right'});
  doc.text('P.UNIT.',140,cy,{align:'right'});
  doc.text('IVA',155,cy,{align:'right'});
  doc.text('IMPORTE',196,cy,{align:'right'});
  cy+=8;
  // Líneas
  doc.setFont('helvetica','normal'); doc.setTextColor(15,32,68);
  f.lineas.forEach((l,idx)=>{
    if(cy>248){doc.addPage();cy=20;}
    if(idx%2===0){doc.setFillColor(240,244,248);doc.rect(14,cy-4,182,7,'F');}
    const imp=(l.qty||0)*(l.precio||0);
    const desc=String(l.desc||'');
    const lines=doc.splitTextToSize(desc,90);
    doc.setFontSize(8); doc.setTextColor(15,32,68);
    doc.text(lines[0],16,cy);
    doc.text(String(l.qty||0),116,cy,{align:'right'});
    doc.text(fmtMoney(l.precio||0),140,cy,{align:'right'});
    doc.text((l.iva||21)+'%',155,cy,{align:'right'});
    doc.text(fmtMoney(imp),196,cy,{align:'right'});
    cy+=7;
  });
  // Divisor totales
  doc.setDrawColor(200,212,227); doc.line(14,cy,196,cy); cy+=8;
  // Totales
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(74,96,128);
  doc.text('Base imponible:',128,cy); doc.setTextColor(15,32,68); doc.text(fmtMoney(f.base),196,cy,{align:'right'}); cy+=6;
  doc.setTextColor(74,96,128); doc.text('IVA (21%):',128,cy); doc.setTextColor(15,32,68); doc.text(fmtMoney(f.iva),196,cy,{align:'right'}); cy+=2;
  doc.setDrawColor(200,212,227); doc.line(128,cy,196,cy); cy+=6;
  doc.setTextColor(15,32,68); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text('TOTAL:',128,cy); doc.text(fmtMoney(f.total),196,cy,{align:'right'}); cy+=12;
  // Datos de pago (justo después de totales)
  cy+=4;
  doc.setDrawColor(200,212,227); doc.line(14,cy,196,cy); cy+=6;
  doc.setTextColor(74,96,128); doc.setFontSize(7.5); doc.setFont('helvetica','normal');
  doc.text('R.M. Alicante, tomo 3996, folio 28, Insc. 1ª, hoja A -152854.',14,cy); cy+=5;
  doc.text('Para transferencia o ingreso en cuenta, Nº/ ES9100811357620001220430 SABADELL',14,cy); cy+=5;
  doc.text('Indicando: Empresa y nº/factura.',14,cy);
  // Barra inferior dorada
  doc.setFillColor(240,180,41); doc.rect(0,292,W,5,'F');
  doc.save(`${f.num||'documento'}.pdf`);
}

  });
  cy+=6;
  doc.setDrawColor(200,212,227); doc.line(14,cy,196,cy); cy+=8;
  doc.setTextColor(74,96,128); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text('Quedamos a su entera disposición para cualquier aclaración.',14,cy); cy+=14;
  try{doc.addImage('data:image/jpeg;base64,'+PRES_SIGN_B64,'JPEG',134,cy,50,35);}catch(e){}
  doc.setTextColor(74,96,128); doc.setFontSize(7);
  doc.text('Jose · Garvi Recycling Systems, S.L.',160,cy+38,{align:'center'});
  doc.setFillColor(240,180,41); doc.rect(0,292,W,5,'F');
  doc.save('presupuesto-garvi.pdf');
}
function emailPresupuesto(){
  const subject=encodeURIComponent('Presupuesto GARVI Recycling Systems');
  const dir=presDireccion?`Dirección: ${presDireccion}\n`:'';
  const conceptos=presItems.map(it=>`- ${it.name}: ${fmtPresPrice(it.price)} + IVA`).join('\n');
  const body=encodeURIComponent(`Estimado/a cliente,\n\nAdjuntamos presupuesto de servicios:\n\n${dir}${conceptos}\n\nQuedamos a su disposición.\n\nGarvi Recycling Systems, S.L.U.\nTel: 687759465 / 634537926\ncontenedores-garvi@hotmail.com`);
  window.open(`mailto:?subject=${subject}&body=${body}`);
}

// ─── MODAL HELPERS ────────────────────────────────────────────────
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

// ─── FOTO ─────────────────────────────────────────────────────────
function fotoInput(num){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{const c=getContainer(num);if(!c) return;if(!c.fotos) c.fotos=[];c.fotos.push(e.target.result);saveContainers();openContainerModal(num);};
    reader.readAsDataURL(file);
  };
  inp.click();
}
function delFoto(num,idx){const c=getContainer(num);if(!c) return;c.fotos.splice(idx,1);saveContainers();openContainerModal(num);}

// ─── EVENTOS ──────────────────────────────────────────────────────
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay')) closeModal();});
document.addEventListener('input',e=>{
  if(e.target.dataset.action==='edit-linea'){
    const idx=+e.target.dataset.idx; const field=e.target.dataset.field;
    editLinea(idx,field,e.target.value);
  } else if(e.target.dataset.action==='pres-price'){
    presPrices[+e.target.dataset.idx]=parseFloat(e.target.value)||0;
  }
});
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]'); if(!btn) return;
  const {action,param}=btn.dataset;
  if(action==='login') handleLogin();
  else if(action==='tab') renderTab(param);
  else if(action==='open-cont') openContainerModal(param);
  else if(action==='save-cont') saveContainerModal(param);
  else if(action==='del-cont'){if(confirm('¿Eliminar contenedor '+param+'?')){containers=containers.filter(c=>c.num!==param);saveContainers();syncClientes();closeModal();renderContenedores();updateBadge();toastMsg('Eliminado');}}
  else if(action==='nuevo-cont') nuevoContModal();
  else if(action==='crear-cont') crearContenedor();
  else if(action==='foto-cont') fotoInput(param);
  else if(action==='del-foto') delFoto(param,+btn.dataset.idx);
  else if(action==='filter-estado'){filterEstado=param;renderContenedores();}
  else if(action==='cont-view'){contView=param;renderContenedores();}
  else if(action==='filter-retirar'){contView='retirar';filterEstado='todos';searchQ='';renderContenedores();}
  else if(action==='close-modal') closeModal();
  else if(action==='nuevo-albaran') nuevoAlbaranModal();
  else if(action==='nuevo-albaran-from') {closeModal();renderTab('albaranes');setTimeout(()=>nuevoAlbaranModal(param),50);}
  else if(action==='crear-albaran') crearAlbaran(param);
  else if(action==='del-albaran'){albaranes=albaranes.filter(a=>a.id!==param);saveAlbaranes();renderAlbaranes();toastMsg('Eliminado');}
  else if(action==='pdf-albaran') pdfAlbaran(param);
  else if(action==='nueva-factura') nuevaFacturaModal();
  else if(action==='ver-factura') nuevaFacturaModal(param);
  else if(action==='del-factura'){if(confirm('¿Eliminar?')){facturas=facturas.filter(f=>f.id!==param);saveFacturas();renderFacturas();toastMsg('Eliminado');}}
  else if(action==='pdf-factura') pdfFactura(param);
  else if(action==='concepto-grupo'){conceptoGrupo=param;document.querySelectorAll('.qbtn-tab').forEach(b=>b.classList.toggle('active',b.dataset.param===param));renderQBtns();}
  else if(action==='nueva-factura-cl'){closeModal();setTimeout(()=>{renderTab('facturas');setTimeout(()=>{nuevaFacturaModal();setTimeout(()=>{const el=document.getElementById('f-cliente');if(el) el.value=param;},50);},50);},50);}
  else if(action==='fact-mode'){
    factMode=param;
    document.querySelectorAll('.fact-toggle-btn').forEach(b=>b.classList.toggle('active',b.dataset.param===param));
    const vr=document.getElementById('f-venc-row');
    const fn=document.getElementById('f-num');
    if(vr) vr.style.display=param==='factura'?'grid':'none';
    if(fn&&!fn.value.startsWith('P-')&&!fn.value.startsWith('F-')) return;
    if(fn) fn.value=(param==='proforma'?'P-':'F-')+String((param==='proforma'?cfg.ultimaProf||0:cfg.ultimaFact||0)+1).padStart(3,'0');
  }
  else if(action==='add-concepto') addConcepto(btn.dataset.label,btn.dataset.precio,btn.dataset.iva);
  else if(action==='add-linea') addLinea();
  else if(action==='del-linea') delLinea(+param);
  else if(action==='guardar-factura') guardarFactura();
  else if(action==='pdf-factura-preview') pdfFactura(editFactId);
  else if(action==='nueva-factura-cl') {closeModal();}
  else if(action==='nuevo-fin') nuevoFinModal();
  else if(action==='crear-fin') crearFin();
  else if(action==='del-fin'){finanzas=finanzas.filter(f=>f.id!==param);saveFinanzas();renderFinanzas();toastMsg('Eliminado');}
  else if(action==='fin-tab'){finTab=param;renderFinanzas();}
  else if(action==='fin-modal-tab'){
    document.getElementById('fin-tipo').value=param;
    document.getElementById('ft-ing').classList.toggle('active',param==='ingreso');
    document.getElementById('ft-gas').classList.toggle('active',param==='gasto');
  }
  else if(action==='ver-cliente') verClienteModal(param);
  else if(action==='nueva-tarea') nuevaTareaModal();
  else if(action==='crear-tarea') crearTarea();
  else if(action==='del-tarea'){tareas=tareas.filter(t=>t.id!==param);saveTareas();renderTareas();toastMsg('Eliminado');}
  else if(action==='toggle-tarea'){const t=tareas.find(x=>x.id===param);if(t){t.done=!t.done;saveTareas();renderTareas();}}
  else if(action==='tareas-filter'){tareasFilter=param;renderTareas();}
  else if(action==='add-pres-item'){const i=+param;initPresPrices();presItems.push({name:CATALOG_PRES[i].name,price:presPrices[i]??CATALOG_PRES[i].price,iva:CATALOG_PRES[i].iva});renderPresupuestos();}
  else if(action==='del-pres-item'){presItems.splice(+param,1);renderPresupuestos();}
  else if(action==='clear-pres'){presItems=[];renderPresupuestos();}
  else if(action==='pres-scroll'){const el=document.getElementById('pres-preview-section');if(el) el.scrollIntoView({behavior:'smooth'});}
  else if(action==='pres-print') printPresupuesto();
  else if(action==='pres-pdf') pdfPresupuesto();
  else if(action==='pres-email') emailPresupuesto();
  else if(action==='guardar-cliente-extra'){const c=clientes.find(x=>x.id===param);if(c){saveClienteExtra(c.nombre,{dirFacturacion:(document.getElementById('cl-extra-dir')||{}).value||'',cif:(document.getElementById('cl-extra-cif')||{}).value||''});syncClientes();toastMsg('Datos de facturación guardados ✓');verClienteModal(param);}}
  else if(action==='logout') logout();
});
document.getElementById('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter') handleLogin();});
document.getElementById('li-user').addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('li-pass').focus();});

// ─── INIT ─────────────────────────────────────────────────────────
checkSession();
['garvi-logo-sidebar','garvi-logo-login'].forEach(id=>{const el=document.getElementById(id);if(el)el.src='data:image/png;base64,'+PRES_LOGO_B64;});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW OK')).catch(e=>console.log('SW:',e));}
