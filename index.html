<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0b429">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<title>GARVI</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Datalists globales de autocompletado: se rellenan con refreshGlobalDatalists() y están
     disponibles para cualquier input list="..." en cualquier sección, aunque estén fuera de ella -->
<datalist id="dl-global-clientes"></datalist>
<datalist id="dl-global-direcciones"></datalist>
<datalist id="dl-global-telefonos"></datalist>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo-wrap">
      <div class="login-logo-icon"><img id="garvi-logo-login" style="width:48px;height:48px;border-radius:9px;display:block" alt="GARVI"></div>
      <div>
        <div class="login-logo-name">GARVI</div>
        <div class="login-logo-sub">Gestión de Residuos · Alicante</div>
      </div>
    </div>
    <div class="form-row"><label>Usuario</label><input id="li-user" type="text" placeholder="usuario" autocomplete="username"></div>
    <div class="form-row"><label>Contraseña</label><input id="li-pass" type="password" placeholder="contraseña" autocomplete="current-password"></div>
    <div class="login-err" id="li-err"></div>
    <button class="btn btn-primary btn-full" style="margin-top:10px" data-action="login">Entrar</button>
  </div>
</div>
<nav id="nav">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon"><img id="garvi-logo-sidebar" style="width:38px;height:38px;border-radius:9px;display:block" alt="GARVI"></div>
    <div class="sidebar-logo-text">
      <div class="sidebar-logo-name">GARVI</div>
      <div class="sidebar-logo-sub">Gestión de Residuos</div>
    </div>
  </div>
  <div class="sidebar-nav">
    <button class="tab-btn active" data-action="tab" data-param="inicio"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg></span><span class="tab-label">Inicio</span></button>
    <button class="tab-btn" data-action="tab" data-param="contenedores"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 7l2 13h14l2-13M3 7l2-3h14l2 3M9 11v6M15 11v6"/></svg></span><span class="tab-label">Contenedores</span><span class="badge" id="badge-ret" style="display:none">0</span></button>
    <button class="tab-btn" data-action="tab" data-param="facturas"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l4-2 4 2 4-2 4 2"/></svg></span><span class="tab-label">Facturación</span></button>
    <button class="tab-btn" data-action="tab" data-param="seguimiento"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18"/><path d="M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/><path d="M9 16l2 2 4-4"/></svg></span><span class="tab-label">Seguimiento</span></button>
    <button class="tab-btn" data-action="tab" data-param="cobros"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.3 2.3 0 012.3-1.3h.4a2.1 2.1 0 010 4.2h-.4a2.1 2.1 0 000 4.2h.4a2.3 2.3 0 002.3-1.3M12 6.3v1.7M12 16v1.7"/></svg></span><span class="tab-label">Cobros pendientes</span><span class="badge" id="badge-fact" style="display:none">0</span></button>
    <button class="tab-btn" data-action="tab" data-param="presupuestos"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></span><span class="tab-label">Presupuestos</span></button>
    <button class="tab-btn" data-action="tab" data-param="certificados"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a5 5 0 100-10 5 5 0 000 10z"/><path d="M8.5 13.5L7 22l5-3 5 3-1.5-8.5"/></svg></span><span class="tab-label">Certificados</span></button>
    <button class="tab-btn" data-action="tab" data-param="tareas"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 12l2 2 4-4"/></svg></span><span class="tab-label">Tareas</span></button>
    <button class="tab-btn" data-action="tab" data-param="finanzas"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2"/></svg></span><span class="tab-label">Finanzas</span></button>
    <button class="tab-btn" data-action="tab" data-param="clientes"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></span><span class="tab-label">Clientes</span></button>
    <button class="tab-btn" data-action="tab" data-param="albaranes"><span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12h6M9 16h4"/></svg></span><span class="tab-label">Albaranes</span></button>
    <button class="tab-btn nav-export" data-action="exportar-copia"><span class="tab-icon">💾</span><span class="tab-label">Copia</span></button>
  </div>
  <div class="sidebar-footer">
    <div class="sidebar-avatar" id="sidebar-avatar">—</div>
    <div id="sidebar-username">—</div>
    <button class="sidebar-export" data-action="exportar-copia" title="Exportar copia de seguridad">💾</button>
    <button class="sidebar-logout" data-action="logout" title="Cerrar sesión"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
</nav>
<div id="app">
  <div class="section active" id="sec-inicio"></div>
  <div class="section" id="sec-contenedores"></div>
  <div class="section" id="sec-albaranes"></div>
  <div class="section" id="sec-facturas"></div>
  <div class="section" id="sec-seguimiento"></div>
  <div class="section" id="sec-cobros"></div>
  <div class="section" id="sec-finanzas"></div>
  <div class="section" id="sec-clientes"></div>
  <div class="section" id="sec-tareas"></div>
  <div class="section" id="sec-presupuestos"></div>
  <div class="section" id="sec-certificados"></div>
</div>
<div id="modal-overlay"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="js/datos.js"></script>
<script src="js/nube.js"></script>
<script src="js/inicio.js"></script>
<script src="js/contenedores.js"></script>
<script src="js/facturacion.js"></script>
<script src="js/cobros.js"></script>
<script src="js/importar-deudores.js"></script>
<script src="js/seguimiento.js"></script>
<script src="js/seguimiento-import.js"></script>
<script src="js/copia-auto.js"></script>
<script src="js/gestion.js"></script>
<script src="js/eventos.js"></script>
</body>
</html>
