      <thead><tr><th>Tipo de residuo</th><th>Código LER</th><th>Toneladas</th><th>Destino / Gestor final</th></tr></thead>
      <tbody><tr>
        <td>${ct.residuo}</td>
        <td>${ct.ler}</td>
        <td id="cert-meta-toneladas">${f.toneladas||'—'}</td>
        <td>${ct.destino}</td>
      </tr></tbody>
    </table>
    <p style="margin-top:18px;font-size:12px;color:#333">Alicante, <span id="cert-meta-fecha">${fechaCertTexto(f.fecha)}</span></p>
    <div class="doc-sign-wrap">
      <div>
        <img src="data:image/jpeg;base64,${PRES_SIGN_B64}" alt="Firma y sello">
        <div class="doc-sign-name">D. Jose Antonio García Sebastián<br>Administrador de la empresa Garvi Recycling Systems, S.L.U.</div>
      </div>
    </div>
  </div>`;
}
function renderCertificados(){
  const sec=document.getElementById('sec-certificados');
  const q=certQ.toLowerCase();
  const listFiltered=certificados.filter(c=>!q||(c.productor||'').toLowerCase().includes(q)||(c.obra||'').toLowerCase().includes(q)||(c.periodo||'').toLowerCase().includes(q));
  const listHtml=[...listFiltered].reverse().map(c=>`
    <div class="factura-item" data-action="ver-certificado" data-param="${c.id}">
      <div style="flex:1">
        <div style="font-weight:700;font-size:13px">${c.productor||'—'} <span style="font-size:10px;font-weight:700;color:var(--accent-blue);background:var(--surface2);padding:1px 7px;border-radius:20px;margin-left:4px">${(CERT_TIPOS[c.tipo]||CERT_TIPOS.escombros).label}</span></div>
        <div style="font-size:11px;color:var(--muted)">${c.obra||''} ${c.periodo?'· '+c.periodo:''}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary btn-sm" data-action="pdf-certificado" data-param="${c.id}" style="padding:3px 8px;font-size:11px">PDF</button>
        <button class="btn btn-danger btn-sm" data-action="del-certificado" data-param="${c.id}" style="padding:3px 8px;font-size:11px">🗑</button>
      </div>
    </div>`).join('');
  sec.innerHTML=`
    <div class="section-header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="section-title">Certificados${editCertId?' <span style="font-size:11px;font-weight:700;color:var(--accent-blue);background:var(--surface2);padding:2px 8px;border-radius:20px">editando</span>':''}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" data-action="nuevo-certificado">+ Nuevo</button>
          <button class="btn btn-secondary btn-sm" data-action="cert-pdf">📄 Crear PDF</button>
        </div>
      </div>
    </div>
    <div class="pres-layout">
      <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
        <div style="font-size:12px;font-weight:700;color:var(--accent-blue);border-bottom:2px solid var(--accent-blue);padding-bottom:6px;text-transform:uppercase;letter-spacing:.4px">Datos del certificado</div>
        <div class="form-row"><label>Tipo de certificado</label>
          <select id="cert-tipo">${Object.entries(CERT_TIPOS).map(([k,v])=>`<option value="${k}"${certForm.tipo===k?' selected':''}>${v.label}</option>`).join('')}</select>
        </div>
        <div class="form-row"><label>Periodo</label><input id="cert-periodo" value="${f_esc(certForm.periodo)}" placeholder="Ej: ABRIL 2026"></div>
        <div class="form-row"><label>Productor</label><input id="cert-productor" value="${f_esc(certForm.productor)}" placeholder="Nombre del productor…"></div>
        <div class="form-row"><label>Obra</label><input id="cert-obra" value="${f_esc(certForm.obra)}" placeholder="Dirección / nombre de la obra…"></div>
        <div class="form-row cols2">
          <div><label>Toneladas</label><input id="cert-toneladas" value="${f_esc(certForm.toneladas)}" placeholder="Ej: 4,5"></div>
          <div><label>Fecha</label><input id="cert-fecha" type="date" value="${certForm.fecha}"></div>
        </div>
        <button class="btn btn-primary btn-sm" data-action="guardar-certificado" style="margin-top:6px">💾 Guardar en la app</button>
        <hr class="divider">
        <div style="font-size:12px;font-weight:700;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.4px">Certificados guardados (${certificados.length})</div>
        <input class="search-input" id="cert-search" type="search" placeholder="Buscar productor, obra o periodo…" value="${certQ}">
        <div>${listHtml||'<div class="empty-state" style="padding:10px 0">Sin certificados guardados</div>'}</div>
      </div>
      <div class="card" style="padding:14px">
        <div style="font-size:12px;font-weight:700;color:var(--accent-blue);margin-bottom:10px;border-bottom:2px solid var(--accent-blue);padding-bottom:6px;text-transform:uppercase;letter-spacing:.4px">Vista previa en tiempo real</div>
        <div id="cert-doc-content">${buildCertPreview()}</div>
      </div>
    </div>`;
  document.getElementById('cert-tipo').addEventListener('change',e=>{certForm.tipo=e.target.value;renderCertificados();});
  ['periodo','productor','obra','toneladas'].forEach(field=>{
    document.getElementById('cert-'+field).addEventListener('input',e=>{
      certForm[field]=e.target.value;
      const el=document.getElementById('cert-meta-'+field);
      if(el) el.textContent=e.target.value||(field==='toneladas'?'—':'________________');
    });
  });
  document.getElementById('cert-fecha').addEventListener('input',e=>{
    certForm.fecha=e.target.value;
    const el=document.getElementById('cert-meta-fecha');
    if(el) el.textContent=fechaCertTexto(certForm.fecha);
  });
  document.getElementById('cert-search').addEventListener('input',e=>{certQ=e.target.value;reFocusInput('cert-search',renderCertificados);});
}
function f_esc(v){return (v||'').toString().replace(/"/g,'&quot;');}
function guardarOActualizarCertificado(){
  if(editCertId){
    const c=certificados.find(x=>x.id===editCertId);
    if(c) Object.assign(c,certForm);
    else{certificados.push({id:editCertId,...certForm});}
  } else {
    editCertId=Date.now().toString();
    certificados.push({id:editCertId,...certForm});
  }
  saveCertificados();
}
function guardarCertificado(){
  if(!certForm.productor.trim()){toastMsg('Indica el productor');return;}
  guardarOActualizarCertificado();
  renderCertificados();toastMsg('Certificado guardado ✓');
}
function verCertificado(id){
  const c=certificados.find(x=>x.id===id); if(!c) return;
  editCertId=id;
  certForm={tipo:c.tipo||'escombros',periodo:c.periodo||'',productor:c.productor||'',obra:c.obra||'',toneladas:c.toneladas||'',fecha:c.fecha||todayISO()};
  renderCertificados();
  toastMsg('Certificado cargado en el formulario — se actualizará al guardar/exportar');
}
function nuevoCertificado(){
  editCertId=null;
  certForm={tipo:'escombros',periodo:'',productor:'',obra:'',toneladas:'',fecha:todayISO()};
  renderCertificados();
}
function delCertificado(id){certificados=certificados.filter(c=>c.id!==id);saveCertificados();if(editCertId===id) editCertId=null;renderCertificados();toastMsg('Eliminado');}
function pdfCertificado(idOrNull){
  const c=idOrNull?certificados.find(x=>x.id===idOrNull):certForm;
  if(!c||!c.productor||!c.productor.trim()){toastMsg('Indica al menos el productor');return;}
  if(!idOrNull){guardarOActualizarCertificado();renderCertificados();}
  const ct=CERT_TIPOS[c.tipo]||CERT_TIPOS.escombros;
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  try{drawGVLogo(doc,14,10,20);}catch(e){}
  doc.setTextColor(15,32,68); doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('GARVI RECYCLING SYSTEMS, S.L.U.',40,16);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(74,96,128);
  doc.text('Ptda.Torrellano alto P1, Nº76',40,21);
  doc.text('C.P.03320 Elche (Alicante)',40,26);
  doc.text('Cif.B54970439',40,31);
  let cy=50;
  doc.setTextColor(15,32,68); doc.setFontSize(18); doc.setFont('times','bold');
  doc.text('CERTIFICADO DE GESTIÓN DE RESIDUOS',14,cy); cy+=14;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(30,30,30);
  doc.text('Nº AUTORIZACIÓN:  664/T/RNP/CV',14,cy); cy+=8;
  doc.text('3596/T08/CV – Transporte de residuos',14,cy); cy+=8;
  doc.text('Cod. E3L (NIMA): 0300014535',14,cy); cy+=12;
  doc.text(`PERIODO: ${c.periodo||''}`,14,cy); cy+=8;
  doc.text(`PRODUCTOR: ${c.productor||''}`,14,cy); cy+=8;
  doc.text(`OBRA: ${c.obra||''}`,14,cy); cy+=14;
  const cols=[{x:14,w:96,label:'TIPO DE RESIDUO'},{x:110,w:26,label:'CÓD. LER'},{x:136,w:24,label:'TONELADAS'},{x:160,w:36,label:'DESTINO/GESTOR'}];
  doc.setFillColor(15,32,68); doc.rect(14,cy-5,182,8,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(7.5); doc.setFont('helvetica','bold');
  cols.forEach(col=>doc.text(col.label,col.x+2,cy));
  cy+=6;
  const vals=[ct.residuo,ct.ler,String(c.toneladas||''),ct.destino];
  doc.setTextColor(15,32,68); doc.setFont('helvetica','normal'); doc.setFontSize(8);
  let maxLines=1;
  const wrapped=cols.map((col,i)=>{const ls=doc.splitTextToSize(vals[i],col.w-4);maxLines=Math.max(maxLines,ls.length);return ls;});
  cols.forEach((col,i)=>doc.text(wrapped[i],col.x+2,cy+3));
  doc.setDrawColor(200,200,200);
  doc.rect(14,cy-6,182,maxLines*4.5+6);
  cy+=maxLines*4.5+18;
  doc.setFontSize(10); doc.setTextColor(30,30,30);
  doc.text(`Alicante, ${fechaCertTexto(c.fecha)}`,14,cy);
  cy+=10;
  try{doc.addImage('data:image/jpeg;base64,'+PRES_SIGN_B64,'JPEG',130,cy,50,35);}catch(e){}
  doc.setFontSize(9);
  doc.text('D. Jose Antonio García Sebastián',14,cy+40);
  doc.text('Administrador de la empresa Garvi Recycling Systems, S.L.U.',14,cy+46);
  doc.save(`certificado-${(c.obra||'garvi').toString().slice(0,25).replace(/[^a-z0-9]+/gi,'_')||'garvi'}.pdf`);
}

// ─── MODAL HELPERS ────────────────────────────────────────────────
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

// ─── FOTO ─────────────────────────────────────────────────────────
function fotoInput(num){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{const c=getContainer(num);if(!c) return;if(!c.fotos) c.fotos=[];c.fotos.push(e.target.result);saveContainers();openContainerModal(num);};
    reader.readAsDataURL(file);
  };
  inp.click();
}
function delFoto(num,idx){const c=getContainer(num);if(!c) return;c.fotos.splice(idx,1);saveContainers();openContainerModal(num);}

// ─── EVENTOS ──────────────────────────────────────────────────────
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay')) closeModal();});
document.addEventListener('input',e=>{
  if(e.target.dataset.action==='edit-linea'){
    const idx=+e.target.dataset.idx; const field=e.target.dataset.field;
    editLinea(idx,field,e.target.value);
    saveFacturaDraft();
  } else if(e.target.dataset.action==='pres-price'){
    presPrices[+e.target.dataset.idx]=parseFloat(e.target.value)||0;
  } else if(['f-num','f-fecha','f-venc','f-cliente','f-nif','f-dir','f-tel','f-email','f-notas'].includes(e.target.id)){
    saveFacturaDraft();
  }
});
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]'); if(!btn) return;
  const {action,param,idx}=btn.dataset;
  if(action==='login') handleLogin();
  else if(action==='tab') renderTab(param);
  else if(action==='open-cont') openContainerModal(param);
  else if(action==='save-cont') saveContainerModal(param);
  else if(action==='del-cont'){if(confirm('¿Eliminar contenedor '+param+'?')){containers=containers.filter(c=>c.num!==param);saveContainers();syncClientes();closeModal();renderContenedores();updateBadge();toastMsg('Eliminado');}}
  else if(action==='nuevo-cont') nuevoContModal();
  else if(action==='crear-cont') crearContenedor();
  else if(action==='foto-cont') fotoInput(param);
  else if(action==='del-foto') delFoto(param,+btn.dataset.idx);
  else if(action==='filter-estado'){filterEstado=param;applyContFilter();}
  else if(action==='cont-view'){contView=param;applyContFilter();}
  else if(action==='filter-retirar'){contView='retirar';filterEstado='todos';searchQ='';const si=document.getElementById('cont-search');if(si)si.value='';applyContFilter();}
  else if(action==='close-modal') closeModal();
  else if(action==='nuevo-albaran') nuevoAlbaranModal();
  else if(action==='nuevo-albaran-from') {closeModal();renderTab('albaranes');setTimeout(()=>nuevoAlbaranModal(param),50);}
  else if(action==='crear-albaran') crearAlbaran(param);
  else if(action==='del-albaran'){albaranes=albaranes.filter(a=>a.id!==param);saveAlbaranes();renderAlbaranes();toastMsg('Eliminado');}
  else if(action==='pdf-albaran') pdfAlbaran(param);
  else if(action==='pdf-albaranes') pdfAlbaranes();
  else if(action==='pdf-contenedores') pdfContenedores();
  else if(action==='cont-map-retry') recalcularUbicaciones();
  else if(action==='cont-map-fullscreen') toggleMapFullscreen();
  else if(action==='pdf-finanzas') pdfFinanzas();
  else if(action==='pdf-clientes') pdfClientes();
  else if(action==='pdf-tareas') pdfTareas();
  else if(action==='nueva-factura') nuevaFacturaModal();
  else if(action==='ver-factura') nuevaFacturaModal(param);
  else if(action==='del-factura'){if(confirm('¿Eliminar?')){facturas=facturas.filter(f=>f.id!==param);saveFacturas();renderFacturas();toastMsg('Eliminado');}}
  else if(action==='pdf-factura') pdfFactura(param);
  else if(action==='pdf-facturas') pdfFacturas();
  else if(action==='concepto-grupo'){conceptoGrupo=param;document.querySelectorAll('.qbtn-tab').forEach(b=>b.classList.toggle('active',b.dataset.param===param));renderQBtns();}
  else if(action==='nueva-factura-cl'){closeModal();setTimeout(()=>{renderTab('facturas');setTimeout(()=>{nuevaFacturaModal();setTimeout(()=>{const el=document.getElementById('f-cliente');if(el) el.value=param;},50);},50);},50);}
  else if(action==='fact-mode'){
    factMode=param;
    document.querySelectorAll('.fact-toggle-btn').forEach(b=>b.classList.toggle('active',b.dataset.param===param));
    const vr=document.getElementById('f-venc-row');
    const fn=document.getElementById('f-num');
    if(vr) vr.style.display=param==='factura'?'grid':'none';
    if(fn&&!fn.value.startsWith('P-')&&!fn.value.startsWith('F-')){saveFacturaDraft();return;}
    if(fn) fn.value=(param==='proforma'?'P-':'F-')+String((param==='proforma'?cfg.ultimaProf||0:cfg.ultimaFact||0)+1).padStart(3,'0');
    saveFacturaDraft();
  }
  else if(action==='add-concepto') addConcepto(btn.dataset.label,btn.dataset.precio,btn.dataset.iva);
  else if(action==='add-linea') addLinea();
  else if(action==='del-linea') delLinea(+param);
  else if(action==='guardar-factura') guardarFactura();
  else if(action==='pdf-factura-preview') pdfFactura(editFactId);
  else if(action==='nueva-factura-cl') {closeModal();}
  else if(action==='nuevo-fin') nuevoFinModal();
  else if(action==='crear-fin') crearFin();
  else if(action==='del-fin'){finanzas=finanzas.filter(f=>f.id!==param);saveFinanzas();renderFinanzas();toastMsg('Eliminado');}
  else if(action==='fin-tab'){finTab=param;renderFinanzas();}
  else if(action==='fin-modal-tab'){
    document.getElementById('fin-tipo').value=param;
    document.getElementById('ft-ing').classList.toggle('active',param==='ingreso');
    document.getElementById('ft-gas').classList.toggle('active',param==='gasto');
  }
  else if(action==='ver-cliente') verClienteModal(param);
  else if(action==='nueva-tarea') nuevaTareaModal();
  else if(action==='crear-tarea') crearTarea();
  else if(action==='del-tarea'){tareas=tareas.filter(t=>t.id!==param);saveTareas();renderTareas();toastMsg('Eliminado');}
  else if(action==='toggle-tarea'){const t=tareas.find(x=>x.id===param);if(t){t.done=!t.done;saveTareas();renderTareas();}}
  else if(action==='tareas-filter'){tareasFilter=param;renderTareas();}
  else if(action==='add-pres-item'){const i=+param;initPresPrices();presItems.push({name:CATALOG_PRES[i].name,price:presPrices[i]??CATALOG_PRES[i].price,iva:CATALOG_PRES[i].iva});renderPresupuestos();}
  else if(action==='del-pres-item'){presItems.splice(+param,1);renderPresupuestos();}
  else if(action==='clear-pres'){presItems=[];renderPresupuestos();}
  else if(action==='pres-scroll'){const el=document.getElementById('pres-preview-section');if(el) el.scrollIntoView({behavior:'smooth'});}
  else if(action==='pres-print') printPresupuesto();
  else if(action==='pres-pdf') pdfPresupuesto();
  else if(action==='pres-email') emailPresupuesto();
  else if(action==='guardar-cliente-extra'){const c=clientes.find(x=>x.id===param);if(c){saveClienteExtra(c.nombre,{dirFacturacion:(document.getElementById('cl-extra-dir')||{}).value||'',cif:(document.getElementById('cl-extra-cif')||{}).value||''});syncClientes();toastMsg('Datos de facturación guardados ✓');verClienteModal(param);}}
  else if(action==='logout') logout();
  else if(action==='cal-prev') calChangeMonth(-1);
  else if(action==='cal-next') calChangeMonth(1);
  else if(action==='cal-sel-day') calSelectDay(param);
  else if(action==='nuevo-aviso') nuevoAvisoModal();
  else if(action==='editar-aviso') nuevoAvisoModal(param);
  else if(action==='crear-aviso') crearAviso();
  else if(action==='del-aviso'){if(confirm('¿Eliminar aviso?')) delAviso(param);}
  else if(action==='completar-unidad'){
    const a=avisos.find(x=>x.id===param);
    if(a){
      if(!Array.isArray(a.completados)) a.completados=[];
      if(a.completados.length<(a.cantidad||1)){ a.completados.push(new Date().toISOString()); saveAvisos(); syncAviso(a); renderAgenda(); renderCalendar(); }
    }
  }
  else if(action==='deshacer-unidad-idx'){
    const a=avisos.find(x=>x.id===param);
    if(a&&Array.isArray(a.completados)){ a.completados.splice(+idx,1); saveAvisos(); syncAviso(a); renderAgenda(); renderCalendar(); }
  }
  else if(action==='copy-aviso') iniciarCopiaAviso(param);
  else if(action==='confirmar-copia-aviso') confirmarCopiaAviso(param);
  else if(action==='guardar-certificado') guardarCertificado();
  else if(action==='nuevo-certificado') nuevoCertificado();
  else if(action==='ver-certificado') verCertificado(param);
  else if(action==='del-certificado'){if(confirm('¿Eliminar certificado?')) delCertificado(param);}
  else if(action==='pdf-certificado') pdfCertificado(param);
  else if(action==='cert-pdf') pdfCertificado(null);
});
document.getElementById('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter') handleLogin();});
document.getElementById('li-user').addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('li-pass').focus();});

// ─── INIT ─────────────────────────────────────────────────────────
checkSession();
initFirebase();
['garvi-logo-sidebar','garvi-logo-login'].forEach(id=>{const el=document.getElementById(id);if(el)el.src='data:image/png;base64,'+PRES_LOGO_B64;});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW OK')).catch(e=>console.log('SW:',e));}
